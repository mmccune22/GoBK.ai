  const openEditPrompt=(p)=>{setEditingPrompt(p.id);setPromptForm({name:p.name,prompt:p.prompt});setShowPromptModal(true);};
  const savePrompt=()=>{
    if(!promptForm.name.trim()||!promptForm.prompt.trim())return;
    if(editingPrompt){
      setAiPrompts(prev=>prev.map(p=>p.id===editingPrompt?{...p,name:promptForm.name.trim(),prompt:promptForm.prompt.trim()}:p));
    }else{
      setAiPrompts(prev=>[...prev,{id:"p_"+Date.now(),name:promptForm.name.trim(),prompt:promptForm.prompt.trim()}]);
    }
    setShowPromptModal(false);
  };
  const deletePrompt=async(p)=>{
    if(await confirm({title:"Delete Prompt",message:'Are you sure you want to delete "'+p.name+'"? This cannot be undone.',confirmLabel:"Delete"})){
      setAiPrompts(prev=>prev.filter(x=>x.id!==p.id));
    }
  };

  useEffect(()=>{localStorage.setItem("bkfl_lite_org_v1",JSON.stringify(org));},[org]);
  const [counseling,setCounseling]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_counseling_v1");return s?JSON.parse(s):{link:"https://www.cricketdebt.com/signup/449858",code:"449858"};}
    catch{return {link:"https://www.cricketdebt.com/signup/449858",code:"449858"};}
  });
  useEffect(()=>{localStorage.setItem("bkfl_lite_counseling_v1",JSON.stringify(counseling));},[counseling]);
  useEffect(()=>{localStorage.setItem("bkfl_lite_users_v2",JSON.stringify(users));},[users]);
  useEffect(()=>{localStorage.setItem("bkfl_lite_lead_stages",JSON.stringify(leadStages));},[leadStages]);
  useEffect(()=>{localStorage.setItem("bkfl_lite_matter_stages",JSON.stringify(matterStages));},[matterStages]);

  const saveOrg=()=>{setOrgSaved(true);setTimeout(()=>setOrgSaved(false),2000);};
  const addUser=()=>{
    if(!userForm.firstName||!userForm.lastName||!userForm.email)return;
    if(editingUser){
      setUsers(prev=>prev.map(u=>u.id===editingUser?{...u,...userForm}:u));
      setEditingUser(null);
    }else{
      setUsers(prev=>[...prev,{...userForm,id:Date.now(),createdDate:new Date().toISOString().split("T")[0],status:userForm.status||"Active"}]);
    }
    setUserForm({firstName:"",lastName:"",email:"",role:"Staff",status:"Active"});setShowAddUser(false);
  };
  const startEditUser=(u)=>{setEditingUser(u.id);setUserForm({firstName:u.firstName,lastName:u.lastName,email:u.email,role:u.role,status:u.status||"Active"});setShowAddUser(true);};

  const inputStyle={width:"100%",padding:"12px 14px",fontSize:14,border:"1px solid #d0d0d0",borderRadius:8,outline:"none",fontFamily:"inherit",boxSizing:"border-box"};
  const labelStyle={fontSize:12,fontWeight:500,color:"#888",marginBottom:6,display:"block"};

  return(
    <div style={{padding:"24px 28px",flex:1}}>
      <h1 style={{fontSize:22,fontWeight:700,color:"#434343",marginBottom:20}}>Settings</h1>
      <div style={{display:"flex",gap:0,marginBottom:24,borderRadius:8,overflow:"hidden",border:"1px solid #d0d0d0",width:"fit-content"}}>
        <button onClick={()=>setSettingsTab("organization")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="organization"?"#7a9c80":"#fff",color:settingsTab==="organization"?"#fff":"#434343"}}>Organization Details</button>
        <button onClick={()=>setSettingsTab("users")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="users"?"#7a9c80":"#fff",color:settingsTab==="users"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>User Management</button>
        <button onClick={()=>setSettingsTab("stages")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="stages"?"#7a9c80":"#fff",color:settingsTab==="stages"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>Lead Stages</button>
        <button onClick={()=>setSettingsTab("tasks")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="tasks"?"#7a9c80":"#fff",color:settingsTab==="tasks"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>Tasks</button>
        <button onClick={()=>setSettingsTab("communications")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="communications"?"#7a9c80":"#fff",color:settingsTab==="communications"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>Communications</button>
        <button onClick={()=>setSettingsTab("docs")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="docs"?"#7a9c80":"#fff",color:settingsTab==="docs"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>Documents</button>
        <button onClick={()=>setSettingsTab("counseling")} style={{padding:"10px 24px",fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:settingsTab==="counseling"?"#7a9c80":"#fff",color:settingsTab==="counseling"?"#fff":"#434343",borderLeft:"1px solid #d0d0d0"}}>Counseling Class</button>
      </div>

      {settingsTab==="organization"&&(
        <div style={{maxWidth:700}}>
          {/* Logo Section */}
          <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",padding:24,marginBottom:24,display:"flex",alignItems:"center",gap:20}}>
            <div style={{width:80,height:80,borderRadius:"50%",background:"#e7eae5",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
              {org.logo?<img src={org.logo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke="#7A9C80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:"#434343",marginBottom:2}}>Partner Logo</div>
              <div style={{fontSize:12,color:"#888",marginBottom:10}}>Preferred size: 400x400px. PNG or JPG (max. 5MB)</div>
              <div style={{display:"flex",gap:8}}>
                <label style={{padding:"6px 16px",fontSize:12,fontWeight:600,border:"none",borderRadius:6,background:"#7a9c80",color:"#fff",cursor:"pointer"}}>
                  Change
                  <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=ev=>setOrg({...org,logo:ev.target.result});reader.readAsDataURL(file);}}}/>
                </label>
                {org.logo&&<button onClick={()=>setOrg({...org,logo:null})} style={{padding:"6px 16px",fontSize:12,fontWeight:500,border:"1px solid #d0d0d0",borderRadius:6,background:"#fff",color:"#434343",cursor:"pointer"}}>Remove</button>}
              </div>
            </div>
          </div>

          {/* General Information */}
          <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",padding:24,marginBottom:24}}>
            <h2 style={{fontSize:16,fontWeight:700,color:"#434343",marginBottom:20}}>General Information</h2>
            <div style={{marginBottom:16}}>
              <label style={labelStyle}>Organization Name *</label>
              <input value={org.name} onChange={e=>setOrg({...org,name:e.target.value})} style={inputStyle}/>
            </div>
            <div style={{marginBottom:16}}>
              <label style={labelStyle}>Contact Number *</label>
              <input value={org.phone} onChange={e=>setOrg({...org,phone:e.target.value})} style={inputStyle}/>
            </div>
            <div style={{marginBottom:0}}>
              <label style={labelStyle}>Website - (Optional)</label>
              <input value={org.website} onChange={e=>setOrg({...org,website:e.target.value})} placeholder="https://www.example.com" style={inputStyle}/>
            </div>
          </div>

          {/* Office Address */}
          <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",padding:24,marginBottom:24}}>
            <h2 style={{fontSize:16,fontWeight:700,color:"#434343",marginBottom:20}}>Office Address</h2>
            <div style={{marginBottom:16}}>
              <label style={labelStyle}>Street Address *</label>
              <input value={org.street} onChange={e=>setOrg({...org,street:e.target.value})} style={inputStyle}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
              <div>
                <label style={labelStyle}>City *</label>
                <input value={org.city} onChange={e=>setOrg({...org,city:e.target.value})} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>State *</label>
                <input value={org.state} onChange={e=>setOrg({...org,state:e.target.value})} style={inputStyle}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div>
                <label style={labelStyle}>Country *</label>
                <input value={org.country} onChange={e=>setOrg({...org,country:e.target.value})} style={inputStyle}/>
              </div>
              <div>
                <label style={labelStyle}>ZIP Code *</label>
                <input value={org.zip} onChange={e=>setOrg({...org,zip:e.target.value})} style={inputStyle}/>
              </div>
            </div>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={saveOrg} style={{padding:"10px 28px",fontSize:14,fontWeight:600,border:"none",borderRadius:6,background:"#7a9c80",color:"#fff",cursor:"pointer"}}>Save Changes</button>
            {orgSaved&&<span style={{fontSize:13,color:"#3d5c43",fontWeight:500}}>Saved successfully!</span>}
          </div>
        </div>
      )}

      {settingsTab==="stages"&&(
        <div style={{maxWidth:900}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>Lead Stages are fixed in this version and set automatically by the system — staff never change them by hand. Each Stage carries pre-set Tasks. Every AI-drafted email requires law firm approval before it is sent.</p>
          {[
            {name:"New Lead",desc:"A Contact and Lead exist, but the intake form has not been sent. Created manually by staff after a phone call, or automatically when a debtor first enters the system.",tasks:[{t:"Send the intake link",w:"Created with the Lead when the link isn\u2019t sent at creation. Completes automatically the moment the link is sent."}]},
            {name:"Intake Sent",desc:"The intake form link has been emailed to the debtor. Set automatically when the link is sent — by approving the send-intake Task, or at Lead creation with the send box checked.",tasks:[{t:"Approve follow-up email — intake not completed",w:"Created 1 week after the link is sent and repeats weekly until the debtor submits. The law firm approves the AI-drafted reminder email before it goes to the Lead."}]},
            {name:"Intake Submitted",desc:"The debtor's intake has been received. Set automatically on submission — any open Intake Sent Tasks are closed automatically.",tasks:[{t:"Review & approve AI Intake Summary email",w:"Created immediately on submission. The law firm reviews the AI Intake Summary before it is emailed to the debtor."},{t:"Review Documents — initial intake submission",w:"Created immediately on submission \u2014 every Document that came in with the intake, one Task for the whole pile, completed when the review pile is cleared."},{t:"Review Documents — follow-up uploads",w:"Created by the daily 5:00 a.m. batch as post-submission uploads arrive \u2014 at most one open Task per Lead, count refreshed by each batch."},{t:"Approve document follow-up request",w:"Created the moment the initial Document review is complete and Documents are still missing. Repeats weekly until the Chase List is empty — the law firm approves every request email before it goes out."}]},
            {name:"Ready for Petition Prep",desc:"The finish line of this workflow. Every requested Document is Approved or Excused by your firm \u2014 nothing is awaiting upload, review, ruling, or follow-up. Set automatically the moment the Document checklist is complete; if new Document activity reopens the checklist (a new request, upload, or rejection), the Lead moves back to Intake Submitted automatically. The Stage shows how many days the case has been ready.",tasks:[],empty:"No automatic Tasks \u2014 the case is ready for petition prep."},
          ].map(s=>{
            const sc=leadStageColors[s.name]||{bg:"#f5f5f5",border:"#999",text:"#555"};
            return(
            <div key={s.name} style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",overflow:"hidden",marginBottom:16}}>
              <div style={{background:sc.bg,padding:"12px 20px",borderBottom:"2px solid "+sc.border}}>
                <span style={{fontSize:13,fontWeight:700,color:sc.text,textTransform:"uppercase",letterSpacing:"0.5px"}}>{s.name}</span>
              </div>
              <div style={{padding:"16px 20px"}}>
                <p style={{fontSize:13,color:"#555",lineHeight:1.6,margin:"0 0 12px"}}>{s.desc}</p>
                {s.tasks.length>0&&<div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Pre-set Tasks</div>}
                {s.tasks.map((task,i)=>(
                  <div key={i} style={{display:"flex",gap:10,padding:"10px 12px",background:"#FBFAF7",borderRadius:8,border:"1px solid #eee",marginBottom:8}}>
                    <div style={{width:16,height:16,borderRadius:"50%",border:"2px solid #7a9c80",flexShrink:0,marginTop:1}}/>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:"#434343"}}>{task.t}</div>
                      <div style={{fontSize:12,color:"#888",marginTop:2,lineHeight:1.5}}>{task.w}</div>
                    </div>
                  </div>
                ))}
                {s.tasks.length===0&&<div style={{fontSize:12,color:"#aaa",fontStyle:"italic"}}>{s.empty||"No automatic Tasks \u2014 the next step is sending the intake link."}</div>}
              </div>
            </div>);
          })}
        </div>
      )}

      {settingsTab==="tasks"&&(
        <div style={{maxWidth:900}}>
          <p style={{fontSize:13,color:"#666",marginBottom:16}}>Six pre-set Tasks run the whole intake process. Every Task is one decision and one click — the AI does the work, a person approves it. There is no mark-complete shortcut: a Task ends by being done, or by being removed. Nothing happens without review. Each Task type also has an On/Off switch. Off means off for everything: every open copy of that Task moves to the Task history as Removed, and the system stops creating new ones. Because every email leaves the system through a Task, turning a Task off also turns off its email.</p>
          {[
            {title:"Send the intake link",stage:"New Lead",created:"Automatically, when a new Lead is created without “Send Intake Form Link” checked — the intake email hasn’t gone out, so sending it becomes the first Task",repeats:"Never — a one-time Task. It stays open until the link is sent, so a new Lead can't sit silently. The law firm can also remove it, which closes it as Removed in the Task history",desc:"To send the link, open the Task — from Dashboard → Outstanding Tasks, or from the Lead's Tasks tab — and click Approve & Send on the draft. That one click sends the “Intake Form Link” template email (see Settings → Communications) and completes this Task."},
            {title:"Approve follow-up email — intake not completed",stage:"Intake Sent",created:"1 week after the intake link is sent",repeats:"Weekly, until the debtor submits the intake",desc:"The AI drafts a reminder email nudging the debtor to complete their intake form. The law firm reviews and approves it before it goes out. When the debtor submits, any open copy of this Task is closed automatically."},
            {title:"Review & approve AI Intake Summary email",stage:"Intake Submitted",created:"Immediately when the intake is submitted",repeats:"Never — a one-time task",desc:"On submission, the AI analyzes everything the debtor submitted and produces the AI Intake Summary — the same summary shown on the Lead’s AI tab. The law firm reviews it and approves the email before the debtor receives it. Nothing is sent without this approval."},
            {title:"Review Documents — initial intake submission",stage:"Intake Submitted",created:"Immediately when the intake is submitted — every Document that came in with the intake is AI-analyzed and waiting for firm review",repeats:"Never — one Task covers the whole initial pile. It completes automatically when the review pile is cleared",desc:"The big review. The debtor's full Document set arrives with the intake, so staff should expect a longer workflow. The Task deep-links into the Lead's Documents tab, where each Document is approved, flagged, or rejected. The Task completes itself when every uploaded Document is ruled on and every skipped Document has a firm ruling — Excuse or Keep Chasing."},
            {title:"Review Documents — follow-up uploads",stage:"Daily 5:00 AM Batch",batch:true,created:"By the daily 5:00 a.m. batch, for Documents uploaded after submission — the handful that arrive from follow-up requests",repeats:"At most one open Task per Lead — the batch refreshes the Document count on an existing open Task instead of stacking a new one",desc:"The small review. After follow-up requests go out, debtors upload a few Documents at a time; those are digested overnight rather than firing a Task per file. Same doorway as the initial review — the Lead's Documents tab — but staff should expect only a handful of Documents. The Dashboard's Intake Inbox still shows live counts between batches."},
            {title:"Approve document follow-up request",stage:"Intake Submitted",created:"The moment the initial Document review is finished, if anything is left to chase — never on a blind timer. The Chase List is built by your review: rejected Documents and Keep Chasing rulings",repeats:"Weekly, while the Chase List is not empty. It stops re-arming — and any open copy auto-completes — the moment the Chase List clears",desc:"Opening the Task shows the AI-drafted request email — the “Document Request — Initial” template the first time, “Document Request — Reminder” on every repeat — and the law firm approves it before it is sent to the debtor."},
          ].map((task,i)=>{
            const enabled=taskToggles[task.title]!==false;
            const sc=task.batch?{bg:"#fef3cd",border:"#F59E0B",text:"#856404"}:(leadStageColors[task.stage]||{bg:"#f5f5f5",border:"#999",text:"#555"});
            return(
            <div key={i} style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",overflow:"hidden",marginBottom:16}}>
              <div style={{padding:"12px 20px",borderBottom:"1px solid #eee",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:16,height:16,borderRadius:"50%",border:"2px solid #7a9c80",flexShrink:0}}/>
                  <span style={{fontSize:14,fontWeight:700,color:"#434343"}}>{task.title}</span>
                </div>
                <span style={{display:"flex",alignItems:"center",gap:20}}>
                  <span style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <span style={{fontSize:10.5,fontWeight:700,color:enabled?"#7a9c80":"#C0392B",textTransform:"uppercase",letterSpacing:"0.6px"}}>{enabled?"On":"Off"}</span>
                    <button onClick={()=>flipTask(task.title)} title={enabled?"On \u2014 the system creates this Task automatically. Click to turn it off.":"Off \u2014 the system will not create this Task. Click to turn it on."} style={{width:56,height:26,borderRadius:13,border:"none",cursor:"pointer",position:"relative",padding:0,background:enabled?"#7a9c80":"#C0392B",transition:"background 0.15s"}}>
                      <span style={{position:"absolute",top:3,left:enabled?33:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.15s",boxShadow:"0 1px 2px rgba(0,0,0,0.3)"}}/>
                    </button>
                  </span>
                  <span style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    <span style={{fontSize:10.5,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:"0.6px"}}>{task.batch?"Runs":"Lead Stage"}</span>
                    <span style={{background:sc.bg,color:sc.text,border:"1px solid "+sc.border,borderRadius:5,padding:"5px 16px",fontSize:14,fontWeight:700,whiteSpace:"nowrap"}}>{task.stage}</span>
                  </span>
                </span>

            {name:"AI Intake Summary",when:"No schedule of its own — drafted when its assigned Task (“Review & approve AI Intake Summary email”) is created. That Task's schedule is on its card in Settings → Tasks",task:"Review & approve AI Intake Summary email",subject:"Your intake review — {FirmName}",body:"Hi {FirstName},\n\nThank you for completing your intake. We've reviewed everything you submitted, and your AI Intake Summary is attached.\n\n{AIIntakeSummary}\n\nA note about this summary: it was prepared with the assistance of artificial intelligence, based on the information and documents you provided. It is a preliminary overview only \u2014 not legal advice \u2014 and it does not reflect a final review of your case. Your attorney will personally review your complete file, and the figures, documents, and next steps described here may change after that review.\n\nWe'll be in touch about next steps. If anything in the summary looks off, or you have questions, reply here or call our office.\n\n{FirmName}"},

/* One shared rulebook for approving an email task: sends the template, completes the task,
   advances the stage (send-intake), and re-arms weekly recurrence. Used by the dashboard
   queue AND the lead's Tasks tab so both doorways behave identically. */
function buildApprovalPatch(l,t){
  const spec=EMAIL_TASKS[t.title];if(!spec)return null;
  const today=new Date().toISOString().split("T")[0];
  const comm={id:Date.now(),date:today,type:"Email",direction:"Outgoing",subject:spec.subject,body:spec.body(l),to:l.firstName+" "+l.lastName,email:l.email||""};
  let tasks=(l.tasks||[]).map(tk=>tk.id===t.id?{...tk,status:"Completed",completedDate:today,completedBy:CURRENT_USER}:tk);
  const patch={communications:[comm,...(l.communications||[])],timeline:[{id:Date.now()+1,date:today,action:spec.tpl+" sent",detail:"Approved from the task queue",user:"Matt McCune"},...(l.timeline||[])]};
  if(t.title==="Send the intake link"){
    const _due=new Date(Date.now()+7*86400000).toISOString().split("T")[0];
    patch.leadStage="Intake Sent";patch.intakeSentDate=today;
    if(taskEnabled("Approve follow-up email — intake not completed")){tasks=[{id:Date.now()+2,title:"Approve follow-up email — intake not completed",due:_due,status:"Pending",assignee:"Matt McCune",stage:"Intake Sent",recurring:true},...tasks];}
  }else if(t.recurring&&l.leadStage===t.stage){
    const next=new Date(Date.now()+7*86400000).toISOString().split("T")[0];
    tasks=[{...t,id:Date.now()+3,status:"Pending",due:next,completedDate:undefined},...tasks];
  }
  patch.tasks=tasks;
  return patch;
}
const MEDIAN_THRESHOLDS={1:63957,2:83476,3:97234,4:114663,5:124663,6:134663}; /* reference data — versioned table in production */
function computeMeansDemo(lead,pkg){
  const cl=lead.docChecklist||[];
  const stub=cl.find(d=>d.docId==="pay_stubs");
  const months=stub?((stub.status==="approved"||stub.status==="ai_accepted")?6:stub.status==="ai_flagged"?3:0):0;
  const income=(pkg.income||[]).reduce((a,x)=>a+(x.monthly||0),0);
  const hh=((pkg.household&&pkg.household.debtors&&pkg.household.debtors.length)||1)+((pkg.household&&pkg.household.dependents)||0);
  const median=MEDIAN_THRESHOLDS[Math.min(6,Math.max(1,hh))];
  const annual=income*12;
  const below=annual<=median;
  const tax=cl.find(d=>d.docId==="tax_return_y1");
  const taxMatch=!!(tax&&(tax.status==="approved"||tax.status==="ai_accepted"));
  const confidence=months===0?0:Math.min(100,20+months*10+(taxMatch?20:0));
  return {months:months,income:income,annual:annual,hh:hh,median:median,below:below,taxMatch:taxMatch,confidence:confidence};
}

                <span style={{width:130,display:"flex",justifyContent:"center"}}><span style={{background:sc.bg,color:sc.text,border:"1px solid "+sc.border,borderRadius:12,padding:"3px 12px",fontSize:11.5,fontWeight:700,whiteSpace:"nowrap"}}>{prepAge(l)}</span></span>

              </div>
            ))}
          </div>
        </div>);
      })()}

      {/* ── Outstanding Tasks — full width ── */}
      <div style={{...cardStyle,display:"flex",flexDirection:"column",marginBottom:18}}>

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="#7a9c80" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              <span>Outstanding Tasks</span>
              <span style={{background:"#7a9c80",color:"#fff",borderRadius:10,padding:"1px 8px",fontSize:11,fontWeight:700}}>{tasks.length}</span>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={runBatch} title="Runs the daily document-review sweep now" style={{padding:"4px 10px",fontSize:11,fontWeight:500,border:"1px dashed #bbb",borderRadius:5,background:"#fff",color:"#888",cursor:"pointer"}}>Run 5:00 AM Batch (dev)</button>
            </div>
          </div>
          <div style={{padding:"8px 20px",borderBottom:"1px solid #f0f0f0",fontSize:11.5,color:"#999",fontStyle:"italic",background:"#FBFAF7"}}>Your approval queue — nothing is sent to a client without you.</div>

}

function LeadsPage({leads,setLeads,matters,setMatters,setPage,setSelectedMatter,setSelectedLead}){
  const dynamicLeadStages=LEAD_STAGES;
  const dynamicMatterStages=(()=>{try{const s=localStorage.getItem("bkfl_lite_matter_stages");if(s)return JSON.parse(s);}catch(e){}return MATTER_STAGES;})();
  const [editingLead,setEditingLead]=useState(null);
  const [editForm,setEditForm]=useState({});
  const inputStyle={width:"100%",padding:"8px 10px",fontSize:13,border:"1px solid #d0d0d0",borderRadius:6,outline:"none",fontFamily:"inherit"};
  const labelStyle={fontSize:12,fontWeight:600,color:"#555",marginBottom:4,display:"block"};

  const openEdit=(lead)=>{
    const secondContact=(lead.contacts||[]).find(c=>c.role==="Lead (Spouse)"||c.role==="Client (Spouse)");
    const isJoint=!!secondContact;
    const joint=secondContact?{firstName:secondContact.name.split(" ")[0],lastName:secondContact.name.split(" ").slice(1).join(" "),email:secondContact.email||"",phone:secondContact.phone||""}:{firstName:"",lastName:"",email:"",phone:""};
    setEditingLead(lead.id);setEditForm({...lead,isJoint,joint});
  };
  const saveEdit=()=>{
    const updated={...editForm};
    const contacts=[{id:1,name:(updated.firstName||"")+" "+(updated.lastName||""),role:"Lead",email:updated.email||"",phone:updated.phone||""}];
    if(updated.isJoint&&updated.joint&&updated.joint.firstName&&updated.joint.lastName){
      contacts.push({id:2,name:updated.joint.firstName+" "+updated.joint.lastName,role:"Lead (Spouse)",email:updated.joint.email||"",phone:updated.joint.phone||""});
      updated.clientFullName=updated.firstName+" "+updated.lastName+" & "+updated.joint.firstName+" "+updated.joint.lastName;
    }else{
      updated.clientFullName=updated.firstName+" "+updated.lastName;
    }
    updated.contacts=contacts;
    setLeads(prev=>prev.map(l=>l.id===editingLead?{...l,...updated}:l));
    setEditingLead(null);
  };

  const [leadSearch,setLeadSearch]=useState("");
  const [filterLeadStage,setFilterLeadStage]=useState("All");
  const [filterLeadType,setFilterLeadType]=useState("All");
  const filteredLeads=useMemo(()=>leads.filter(l=>{
    const ms=(l.firstName+" "+l.lastName).toLowerCase().includes(leadSearch.toLowerCase())||l.email.toLowerCase().includes(leadSearch.toLowerCase())||(l.phone||"").includes(leadSearch);
    return ms&&(filterLeadStage==="All"||l.leadStage===filterLeadStage);
  }),[leads,leadSearch,filterLeadStage,filterLeadType]);

  return(
    <div style={{padding:"24px 28px",flex:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:700,color:"#434343"}}>Leads</h1>
      </div>

      {/* Search and Filters — matching matters layout */}
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{flex:1,position:"relative"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}><circle cx="11" cy="11" r="7" stroke="#999" strokeWidth="1.8"/><path d="M21 21l-4.35-4.35" stroke="#999" strokeWidth="1.8" strokeLinecap="round"/></svg>
          <input value={leadSearch} onChange={e=>setLeadSearch(e.target.value)} placeholder="Search leads..." style={{width:"100%",padding:"9px 12px 9px 36px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,outline:"none"}}/>
        </div>
        <select value={filterLeadStage} onChange={e=>setFilterLeadStage(e.target.value)} style={{padding:"9px 14px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,background:"#fff"}}><option value="All">All Stages</option>{dynamicLeadStages.map(s=><option key={s}>{s}</option>)}</select>
      </div>

      {/* Leads Table — matching matters table style */}
      <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#FBFAF7",borderBottom:"2px solid #e0e0e0"}}>
            {["Name","Email","Phone","Stage","Created"].map(h=><th key={h} style={{textAlign:"left",padding:"10px 14px",color:"#666",fontWeight:600,fontSize:12,textTransform:"uppercase",letterSpacing:0.5}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {filteredLeads.map(lead=>{
              const sc=leadStageColors[lead.leadStage]||leadStageColors["New Lead"];
              return(
                <tr key={lead.id} onClick={()=>{setSelectedLead(lead.id);setPage("lead-detail");}} style={{borderBottom:"1px solid #f0f0f0",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f2f3ef"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td style={{padding:"12px 14px",fontWeight:500,color:"#7A9C80"}}>{lead.firstName} {lead.lastName}</td>
                  <td style={{padding:"12px 14px",color:"#555",fontSize:14,userSelect:"all",cursor:"text"}} onClick={e=>e.stopPropagation()}>{lead.email}</td>
                  <td style={{padding:"12px 14px",color:"#555",fontSize:14,userSelect:"all",cursor:"text"}} onClick={e=>e.stopPropagation()}>{lead.phone}</td>
                  <td style={{padding:"12px 14px"}}><span style={{background:sc.bg,color:sc.text,border:"1px solid "+sc.border,borderRadius:4,padding:"2px 10px",fontSize:12,fontWeight:500,whiteSpace:"nowrap"}}>{lead.leadStage}</span>{lead.leadStage==="Ready for Petition Prep"&&lead.prepReadyDate&&<span style={{fontSize:11,color:"#00695c",fontWeight:700,marginLeft:8,whiteSpace:"nowrap"}}>{prepAge(lead)}</span>}</td>
                  <td style={{padding:"12px 14px",color:"#888"}}>{lead.createdDate?new Date(lead.createdDate+"T12:00:00").toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}):""}</td>
                </tr>
              );
            })}
            {filteredLeads.length===0&&<tr><td colSpan={5} style={{padding:40,textAlign:"center",color:"#999"}}>No leads found.</td></tr>}
          </tbody>
        </table>
      </div>

      {/* Edit Lead Modal */}
      {editingLead&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={()=>setEditingLead(null)}>
          <div style={{background:"#fff",borderRadius:12,padding:"28px 32px",width:480,maxWidth:"90vw",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:18,fontWeight:700,color:"#434343",margin:0}}>Edit Lead</h3>
              <div style={{cursor:"pointer",fontSize:20,color:"#999",lineHeight:1}} onClick={()=>setEditingLead(null)}>&times;</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
              <div><label style={labelStyle}>First Name</label><input type="text" value={editForm.firstName||""} onChange={e=>setEditForm({...editForm,firstName:e.target.value})} style={inputStyle}/></div>
              <div><label style={labelStyle}>Last Name</label><input type="text" value={editForm.lastName||""} onChange={e=>setEditForm({...editForm,lastName:e.target.value})} style={inputStyle}/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
              <div><label style={labelStyle}>Email</label><input type="email" value={editForm.email||""} onChange={e=>setEditForm({...editForm,email:e.target.value})} style={inputStyle}/></div>
              <div><label style={labelStyle}>Phone</label><input type="tel" value={editForm.phone||""} onChange={e=>setEditForm({...editForm,phone:e.target.value})} style={inputStyle}/></div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#434343",cursor:"pointer"}}>
                <input type="checkbox" checked={editForm.isJoint||false} onChange={e=>setEditForm({...editForm,isJoint:e.target.checked,joint:editForm.joint||{firstName:"",lastName:"",email:"",phone:""}})} style={{accentColor:"#7A9C80"}}/>
                <span style={{fontWeight:600}}>Joint Case</span><span style={{color:"#888",fontWeight:400}}>(second contact)</span>
              </label>
            </div>
            {editForm.isJoint&&(
              <div style={{background:"#f9faf8",border:"1px solid #e0e0e0",borderRadius:8,padding:14,marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:"#7A9C80",marginBottom:10}}>Second Contact (Spouse/Joint Filer)</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:10}}>
                  <div><label style={labelStyle}>First Name</label><input type="text" value={(editForm.joint||{}).firstName||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),firstName:e.target.value}})} style={inputStyle}/></div>
                  <div><label style={labelStyle}>Last Name</label><input type="text" value={(editForm.joint||{}).lastName||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),lastName:e.target.value}})} style={inputStyle}/></div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                  <div><label style={labelStyle}>Email</label><input type="email" value={(editForm.joint||{}).email||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),email:e.target.value}})} style={inputStyle}/></div>
                  <div><label style={labelStyle}>Phone</label><input type="tel" value={(editForm.joint||{}).phone||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),phone:e.target.value}})} style={inputStyle}/></div>
                </div>
              </div>
            )}
            <div style={{marginBottom:20}}>
              <label style={labelStyle}>Notes</label>
              <textarea value={editForm.leadNotes||""} onChange={e=>setEditForm({...editForm,leadNotes:e.target.value})} style={{...inputStyle,minHeight:60,resize:"vertical"}}/>
            </div>
            <div style={{borderTop:"1px solid #eee",paddingTop:16,marginBottom:16}}>
              <button onClick={()=>{const lead=editForm;const subject=encodeURIComponent("Your Intake Form - McCune Legal");const body=encodeURIComponent("Hi "+lead.firstName+",\n\nThank you for reaching out to McCune Legal. To get started, please complete your intake form using the link below:\n\n[INTAKE FORM LINK]\n\nIf you have any questions, don't hesitate to reach out.\n\nBest regards,\nMcCune Legal");window.open("mailto:"+lead.email+"?subject="+subject+"&body="+body,"_blank");}} style={{width:"100%",padding:"11px 20px",fontSize:13,fontWeight:600,border:"none",borderRadius:6,background:"#434343",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                Email Lead – Intake Form Link
              </button>
            </div>
            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>setEditingLead(null)} style={{padding:"10px 20px",fontSize:13,fontWeight:500,border:"1px solid #d0d0d0",borderRadius:6,background:"#fff",color:"#434343",cursor:"pointer"}}>Cancel</button>
              <button onClick={saveEdit} style={{padding:"10px 20px",fontSize:13,fontWeight:500,border:"none",borderRadius:6,background:"#7a9c80",color:"#fff",cursor:"pointer"}}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );

/* ─── CALENDAR PAGE ─── */
function ContactsPage({matters,leads,standaloneContacts,setPage,setSelectedMatter,setSelectedLead,setSelectedContact}){
  const [search,setSearch]=useState("");
  const [filterType,setFilterType]=useState("All");
  const allContacts=useMemo(()=>{
    const contacts=[];
    leads.forEach(l=>{
      contacts.push(...l.contacts.map(c=>({...c,source:"Lead",sourceName:l.firstName+" "+l.lastName,sourceId:l.id,matterNumber:null,stage:l.leadStage,bankruptcyType:l.bankruptcyType})));
    });
    (standaloneContacts||[]).forEach(c=>{
      contacts.push({...c,source:"Contact",sourceName:"—",sourceId:null,matterNumber:null,stage:"—",bankruptcyType:"—"});
    });
    return contacts;
  },[matters,leads,standaloneContacts]);

  const filtered=useMemo(()=>allContacts.filter(c=>{
    const fullN=[c.firstName,c.middleName,c.lastName].filter(Boolean).join(" ").toLowerCase();
    const ms=c.name.toLowerCase().includes(search.toLowerCase())||fullN.includes(search.toLowerCase())||c.email.toLowerCase().includes(search.toLowerCase())||(c.phone||"").includes(search);
    return ms;
  }),[allContacts,search,filterType]);

  return(
    <div style={{padding:"24px 28px",flex:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:700,color:"#434343"}}>Contacts</h1>
        <div style={{fontSize:13,color:"#888"}}>{allContacts.length} total contacts</div>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{flex:1,position:"relative"}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}><circle cx="11" cy="11" r="7" stroke="#999" strokeWidth="1.8"/><path d="M21 21l-4.35-4.35" stroke="#999" strokeWidth="1.8" strokeLinecap="round"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search contacts..." style={{width:"100%",padding:"9px 12px 9px 36px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,outline:"none"}}/>
        </div>
      </div>
      <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#FBFAF7",borderBottom:"2px solid #e0e0e0"}}>
            {["Name","Full Name","Email","Phone","Associated With","Stage"].map(h=><th key={h} style={{textAlign:"left",padding:"10px 14px",color:"#666",fontWeight:600,fontSize:12,textTransform:"uppercase",letterSpacing:0.5}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {filtered.map((c,i)=>{
              const fullName=[c.firstName,c.middleName,c.lastName].filter(Boolean).join(" ");
              return(
              <tr key={i} onClick={()=>{setSelectedContact({id:c.id,source:c.source,sourceId:c.sourceId});setPage("contact-detail");}} style={{borderBottom:"1px solid #f0f0f0",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f2f3ef"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"12px 14px",fontWeight:500,color:"#434343"}}>{c.name}</td>
                <td style={{padding:"12px 14px",color:"#555"}}>{fullName||c.name}<div style={{fontSize:10,color:"#999",marginTop:1}}>{c.firstName?[c.firstName,c.middleName?"\""+c.middleName+"\"":"",c.lastName].filter(Boolean).join(" · "):""}</div></td>
                <td style={{padding:"12px 14px",color:"#7A9C80"}}>{c.email||"—"}</td>
                <td style={{padding:"12px 14px",color:"#555"}}>{c.phone||"—"}</td>
                <td style={{padding:"12px 14px",color:"#555"}}>{c.matterNumber?c.matterNumber+"-":""}{c.sourceName}</td>
                <td style={{padding:"12px 14px"}}><StageBadge stage={c.stage}/></td>
              </tr>
            );})}
            {filtered.length===0&&<tr><td colSpan={6} style={{padding:40,textAlign:"center",color:"#999"}}>No contacts found.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─── CONTACT DETAIL PAGE ─── */
function ContactDetailPage({contactId,contactSource,sourceId,matters,setMatters,leads,setLeads,standaloneContacts,setStandaloneContacts,setPage,setSelectedMatter,setSelectedLead,setSelectedContact}){

  // Find the contact and its parent — use sourceId to find the correct parent first
  let contact=null,parentType=null,parentId=null,parentName=null,parentMatterNum=null;
  if(contactSource==="Matter"||!contactSource){
    if(sourceId){const m=matters.find(m=>m.id===sourceId);if(m){const c=m.contacts.find(c=>c.id===contactId);if(c){contact=c;parentType="Matter";parentId=m.id;parentName=m.clientFullName||m.clientName;parentMatterNum=m.matterNumber;}}}
    if(!contact){for(const m of matters){const c=m.contacts.find(c=>c.id===contactId);if(c){contact=c;parentType="Matter";parentId=m.id;parentName=m.clientFullName||m.clientName;parentMatterNum=m.matterNumber;break;}}}
  }
  if(!contact&&(contactSource==="Lead"||!contactSource)){
    if(sourceId){const l=leads.find(l=>l.id===sourceId);if(l){const c=l.contacts.find(c=>c.id===contactId);if(c){contact=c;parentType="Lead";parentId=l.id;parentName=l.firstName+" "+l.lastName;}}}
    if(!contact){for(const l of leads){const c=l.contacts.find(c=>c.id===contactId);if(c){contact=c;parentType="Lead";parentId=l.id;parentName=l.firstName+" "+l.lastName;break;}}}
  }
  if(!contact){
    const c=(standaloneContacts||[]).find(c=>c.id===contactId);
    if(c){contact=c;parentType="Contact";parentId=null;parentName=null;}
  }
  if(!contact)return(<div style={{padding:"24px 28px",flex:1}}><div style={{fontSize:16,color:"#999",textAlign:"center",marginTop:60}}>Contact not found.</div><button onClick={()=>setPage("contacts")} style={{display:"block",margin:"20px auto",background:"#7A9C80",color:"#fff",border:"none",borderRadius:6,padding:"8px 20px",fontSize:13,cursor:"pointer"}}>Back to Contacts</button></div>);

  // Find ALL associated leads and matters for this contact (by name+email match)
  const associations=useMemo(()=>{
    const assoc=[];
    const primaryEmail=contact.email||(contact.emails&&contact.emails[0]&&contact.emails[0].value)||"";
    matters.forEach(m=>{m.contacts.forEach(c=>{
      const cEmail=c.email||(c.emails&&c.emails[0]&&c.emails[0].value)||"";
      if(c.name===contact.name&&cEmail===primaryEmail)assoc.push({type:"Matter",id:m.id,name:m.clientFullName||m.clientName,matterNumber:m.matterNumber,stage:m.matterStage});
    });});
    leads.forEach(l=>{l.contacts.forEach(c=>{
      const cEmail=c.email||(c.emails&&c.emails[0]&&c.emails[0].value)||"";
      if(c.name===contact.name&&cEmail===primaryEmail)assoc.push({type:"Lead",id:l.id,name:l.firstName+" "+l.lastName,stage:l.leadStage});
    });});
    return assoc;
  },[matters,leads,contact]);

  // Generic updater that patches the contact object in its parent array
  const patchContact=(patch)=>{
    const apply=c=>c.id===contactId?{...c,...patch}:c;
    if(parentType==="Matter"){
      setMatters(prev=>prev.map(m=>m.id===parentId?{...m,contacts:m.contacts.map(apply)}:m));
    }else if(parentType==="Lead"){
      setLeads(prev=>prev.map(l=>l.id===parentId?{...l,contacts:l.contacts.map(apply)}:l));
    }else{
      setStandaloneContacts(prev=>(prev||[]).map(apply));
    }
  };

  const update=(field,value)=>{
    const patch={[field]:value};
    if(field==="firstName"||field==="lastName"||field==="middleName"){
      const fn=field==="firstName"?value:contact.firstName;
      const mn=field==="middleName"?value:contact.middleName;
      const ln=field==="lastName"?value:contact.lastName;
      patch.name=[fn,mn,ln].filter(Boolean).join(" ");
    }
    patchContact(patch);
  };

  // --- Multi-value helpers for emails & phones ---
  const emails=contact.emails||[{value:contact.email||"",label:"Personal"}];
  const phones=contact.phones||[{value:contact.phone||"",label:"Mobile"}];

  const setEmails=(newEmails)=>{
    patchContact({emails:newEmails,email:(newEmails[0]||{}).value||""});
  };
  const setPhones=(newPhones)=>{
    patchContact({phones:newPhones,phone:(newPhones[0]||{}).value||""});
  };
  const addEmail=()=>setEmails([...emails,{value:"",label:"Work"}]);
  const addPhone=()=>setPhones([...phones,{value:"",label:"Home"}]);
  const removeEmail=(idx)=>{if(emails.length<=1)return;const n=[...emails];n.splice(idx,1);setEmails(n);};
  const removePhone=(idx)=>{if(phones.length<=1)return;const n=[...phones];n.splice(idx,1);setPhones(n);};
  const updateEmail=(idx,field,val)=>{const n=[...emails];n[idx]={...n[idx],[field]:val};setEmails(n);};
  const updatePhone=(idx,field,val)=>{const n=[...phones];n[idx]={...n[idx],[field]:val};setPhones(n);};

  const EMAIL_LABELS=["Personal","Work","Other"];
  const PHONE_LABELS=["Mobile","Home","Work","Fax","Other"];

  // --- Editable single field component ---
  const EditableField=({label,field,value,type})=>{
    const [editing,setEditing]=useState(false);
    const [draft,setDraft]=useState(value||"");
    useEffect(()=>setDraft(value||""),[value]);
    if(editing)return(<div style={{marginBottom:16}}><div style={{fontSize:12,fontWeight:600,color:"#888",marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>{label}</div><div style={{display:"flex",gap:6}}><input autoFocus value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){update(field,draft);setEditing(false);}if(e.key==="Escape")setEditing(false);}} style={{flex:1,padding:"8px 12px",borderRadius:6,border:"1px solid #7A9C80",fontSize:14,outline:"none"}} type={type||"text"}/><button onClick={()=>{update(field,draft);setEditing(false);}} style={{background:"#7A9C80",color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer"}}>Save</button><button onClick={()=>setEditing(false)} style={{background:"#f0f0f0",color:"#666",border:"none",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer"}}>Cancel</button></div></div>);
    return(<div style={{marginBottom:16,cursor:"pointer"}} onClick={()=>setEditing(true)}><div style={{fontSize:12,fontWeight:600,color:"#888",marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>{label}</div><div style={{fontSize:14,color:value?"#434343":"#bbb",padding:"8px 0",borderBottom:"1px solid #f0f0f0"}}>{value||"Click to add..."}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style={{marginLeft:8,opacity:0.3,verticalAlign:"middle"}}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="#666" strokeWidth="2" strokeLinecap="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="#666" strokeWidth="2"/></svg></div></div>);
  };

  // --- Multi-value row component ---
  const MultiValueRow=({item,idx,labels,onUpdate,onRemove,canRemove,type})=>{
    const [editing,setEditing]=useState(false);
    const [draft,setDraft]=useState(item.value||"");
    useEffect(()=>setDraft(item.value||""),[item.value]);
    return(
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <select value={item.label} onChange={e=>onUpdate(idx,"label",e.target.value)} style={{padding:"7px 8px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:12,background:"#fff",color:"#666",width:90}}>
          {labels.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
        {editing?(
          <div style={{flex:1,display:"flex",gap:6}}>
            <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){onUpdate(idx,"value",draft);setEditing(false);}if(e.key==="Escape"){setDraft(item.value||"");setEditing(false);}}} style={{flex:1,padding:"7px 12px",borderRadius:6,border:"1px solid #7A9C80",fontSize:14,outline:"none"}} type={type||"text"}/>
            <button onClick={()=>{onUpdate(idx,"value",draft);setEditing(false);}} style={{background:"#7A9C80",color:"#fff",border:"none",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>Save</button>
          </div>
        ):(
          <div onClick={()=>setEditing(true)} style={{flex:1,fontSize:14,color:item.value?"#434343":"#bbb",padding:"7px 0",cursor:"pointer",borderBottom:"1px solid #f0f0f0"}}>{item.value||"Click to add..."}</div>
        )}
        {canRemove&&<button onClick={()=>onRemove(idx)} style={{background:"none",border:"none",cursor:"pointer",padding:4,opacity:0.4,fontSize:16,lineHeight:1,color:"#c44"}} title="Remove">&times;</button>}
      </div>
    );
  };

  const initials=contact.name.split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      {/* Top bar */}
      <div style={{padding:"16px 28px",borderBottom:"1px solid #e0e0e0",background:"#fff",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setPage("contacts")} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#7A9C80",fontWeight:500}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="#7A9C80" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          All Contacts
        </button>
        <span style={{color:"#ccc"}}>/</span>
        <span style={{fontSize:14,fontWeight:600,color:"#434343"}}>{contact.name}</span>
        {parentType!=="Contact"&&<span style={{marginLeft:"auto",padding:"3px 10px",borderRadius:4,fontSize:11,fontWeight:600,background:parentType==="Matter"?"#dce8de":"#e8f4fd",color:parentType==="Matter"?"#3d5c43":"#1a73e8"}}>{parentType}</span>}
      </div>

      <div style={{padding:"24px 28px",flex:1,overflowY:"auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:24}}>
          {/* Left column — Contact info */}
          <div>
            {/* Header card */}
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",padding:24,marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:20}}>
                <div style={{width:56,height:56,borderRadius:"50%",background:"#E7EAE5",color:"#7A9C80",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700}}>{initials}</div>
                <div>
                  <h1 style={{fontSize:22,fontWeight:700,color:"#434343",margin:0}}>{contact.name}</h1>
                  <div style={{fontSize:13,color:"#888",marginTop:2}}>Contact</div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}}>
                <EditableField label="First Name" field="firstName" value={contact.firstName}/>
                <EditableField label="Last Name" field="lastName" value={contact.lastName}/>
                <EditableField label="Middle Name" field="middleName" value={contact.middleName}/>
                <EditableField label="Address" field="address" value={contact.address}/>
              </div>
            </div>

            {/* Email Addresses */}
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",padding:24,marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <h3 style={{fontSize:14,fontWeight:600,color:"#434343",margin:0}}>Email Addresses</h3>
                <button onClick={addEmail} style={{background:"none",border:"1px solid #7A9C80",color:"#7A9C80",borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>+ Add Email</button>
              </div>
              {emails.map((em,i)=><MultiValueRow key={i} item={em} idx={i} labels={EMAIL_LABELS} onUpdate={updateEmail} onRemove={removeEmail} canRemove={emails.length>1} type="email"/>)}
            </div>

            {/* Phone Numbers */}
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",padding:24,marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <h3 style={{fontSize:14,fontWeight:600,color:"#434343",margin:0}}>Phone Numbers</h3>
                <button onClick={addPhone} style={{background:"none",border:"1px solid #7A9C80",color:"#7A9C80",borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer",fontWeight:500}}>+ Add Phone</button>
              </div>
              {phones.map((ph,i)=><MultiValueRow key={i} item={ph} idx={i} labels={PHONE_LABELS} onUpdate={updatePhone} onRemove={removePhone} canRemove={phones.length>1} type="tel"/>)}
            </div>

            {/* Notes */}
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",padding:24}}>
              <h3 style={{fontSize:14,fontWeight:600,color:"#434343",marginTop:0,marginBottom:12}}>Notes</h3>
              <EditableField label="" field="contactNotes" value={contact.contactNotes}/>
            </div>
          </div>

          {/* Right column — Associations */}
          <div>
            <div style={{background:"#fff",borderRadius:10,border:"1px solid #e0e0e0",padding:20}}>
              <h3 style={{fontSize:14,fontWeight:600,color:"#434343",marginTop:0,marginBottom:12}}>Associated With</h3>
              {associations.length===0&&<div style={{fontSize:13,color:"#999"}}>No linked leads or matters.</div>}
              {associations.map((a,i)=>(
                <div key={i} onClick={()=>{if(a.type!=="Matter"){setSelectedLead(a.id);setPage("lead-detail");}}} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<associations.length-1?"1px solid #f0f0f0":"none",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f9f9f6"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:600,background:a.type==="Matter"?"#dce8de":"#e8f4fd",color:a.type==="Matter"?"#3d5c43":"#1a73e8"}}>{a.type}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:500,color:"#434343"}}>{a.matterNumber?a.matterNumber+" — ":""}{a.name}</div>
                    <div style={{fontSize:11,color:"#999"}}>{a.stage}</div>
                  </div>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#999" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

opy of the title for any vehicle you own free of any lien. \nAny Court Paperwork, Divorce Decree(s), Permanent Orders, Writs of Garnishments, Foreclosure, Personal Injury, whether filed against you or by you. (If you are being garnished provide contact info (name/phone/email/fax) for your Human Resources Dept. so we can stop garnishment upon filing.)\nDriver's License AND Social Security Card (or W2)\n\n"},
    {id:1777901247826,title:"All docs and funds received",desc:"All docs and funds received",subject:"All docs and funds received",body:"Next Steps in Your Bankruptcy Case:\n\nHello {{contact_first_name}}, \n\nIt appears that your required payment has been received and that the majority of your required documents are now in—great progress.\n\nThe next step in the process is for our paralegal to begin preparing your case. If any documents are still missing, the paralegal will reach out to you directly. If that happens, we'll need that information as soon as possible to keep things moving forward.\n\nOnce the paralegal has completed their review, your case will be turned over to the attorney for a final review. If the attorney has any questions, they will reach out to you.\n\nAfter that, we will schedule a Zoom video call to review and sign all of your documents so we can get your case filed. This call typically takes about 30–45 minutes. We usually send the paperwork to you in advance so you can review it and confirm that your name, address, and other basic information are correct.\n\nDuring this call, we will also prepare you for your creditor meeting (also held on Zoom), where you will meet with the Trustee. We will make sure you are fully prepared for that hearing.\n\nFollowing the trustee meeting in a Chapter 7 case, there is a 60-day waiting period during which parties may object to the discharge. If there are no objections, the discharge is typically entered about 3 months after the trustee meeting.\n\nPlease let us know if you have any questions as we move forward."},
    {id:1777901452807,title:"Please review your paperwork and schedule a Zoom call to review with your attorney",desc:"Please review your paperwork and schedule a Zoom call to review with your attorney",subject:"Please review your paperwork and schedule a Zoom call to review with your attorney",body:"Hello {{contact_first_name}}\n\nWe look forward to getting your case filed and helping you move forward!\n\nTHIS EMAIL WILL NEED TO BE GENERAL AND NON SPECIFIC - SOMETHING LIKE WE ARE FOLLOWING THIS EMAIL WITH YOUR DOCS ETC - WE CAN ADD THE VIDEO TO THIS MAYBE BUT EACH SPECIFIC COMM WITH THE SPECIFIC DOCS WILL HAVE TO BE A MANUAL SENT EMAIL WITH A TASK LIST - WE SHOULD BE ABLE TO ADD THE LINK TO SCHEDULE THE CALL IN THE AUTO EMAILS \n\nPrior to the meeting, please review the documents, and be ready to inform us of any questions you may have at the meeting. We will of course go over these documents with you as well when we meet and answer all of your questions. Please do not sign these documents as we will execute the documents officially when we meet with you. The only pages that will need to be printed out are the \"Signature Pages\" PDF. You DO NOT need to print out the other PDFs. \nThank you and we look forward to seeing you soon.\n\n\n\n"},
    {id:1777901506336,title:"Your appointment is set - What Happens Next:",desc:"Your appointment is set - What Happens Next:",subject:"Your appointment is set - What Happens Next:",body:"Hi {{contact_first_name}}, \n\nNow that your Zoom signing is scheduled, we're entering the final steps before your Chapter 7 bankruptcy case is filed. During the Zoom meeting, we'll review your bankruptcy paperwork together, answer any last-minute questions, and obtain your signatures on the documents needed to file your case with the court.\n\nZOOM MEETING LINKS HERE\n\nOnce everything is signed and we receive your signatures, we will electronically file your bankruptcy case. Filing immediately triggers the automatic stay, which generally stops collection calls, lawsuits, garnishments, repossessions, and foreclosure actions. Your court-appointed trustee will then schedule your 341 Meeting of Creditors, which is usually held about 30 days after filing. This hearing is typically short and conducted by Zoom or phone in many districts. We will prepare you in advance so you know exactly what to expect.\nAfter the 341 meeting, there is generally a 60-day waiting period during which creditors have the opportunity to object to the discharge, although objections are uncommon in routine cases. Assuming everything proceeds normally, the court will then enter your discharge order, which eliminates eligible debts and gives you your financial fresh start. Most Chapter 7 cases are completed approximately 3–4 months after filing.\nAs always, if you have questions at any point during the process, please don't hesitate to reach out. We'll guide you through each step.\n\nPlease watch the video below where I answer the most common questions. \n\n\n"},
    {id:1777901571220,title:"Your Chapter 7 Case is Filed!",desc:"Your Chapter 7 Case is Filed!",subject:"Your Chapter 7 Case is Filed!",body:"Congrats! Your case is filed!\n \nAwesome! Your Chapter 7 case is filed and the protection of the Bankruptcy Code immediately takes effect. No further harassment by your creditors is permitted. Garnishment, foreclosure, repossession, lawsuits, collection activities, etc all must cease immediately.\n \nPlease read this entire update before reaching out with questions. Your attorney, Matt McCune, created this video to explain in detail, how the next steps in the process of your Chapter 7 Bankruptcy Case will proceed: \n\nWATCH IMPORTANT VIDEO HERE: \n\nYOUR CHAPTER 7 CASE IS FILED \n\nWHAT HAPPENS NOW THAT YOUR CHAPTER 7 CASE IS FILED?\n\nGIVE YOUR CASE INFO TO ANY CREDITOR WHO CONTACTS YOU: {{case_number}}\n \nCHAPTER 7 DISTRICT OF COLORADO\n \nCASE FILING DATE: {{filing_date}}\n \nBANKRUPTCY CASE NUMBER: {{case_number}}\n \nHERE IS WHAT HAPPENS NOW:\n \nA Zoom video appearance with the Court, called a \"Section 341 First Meeting of Creditors\" has been scheduled for: \n\nYOU MUST ATTEND THIS HEARING!\n\nThe hearing will be ON ZOOM!\n \nWE WILL CALL YOU 30 MINUTES BEFORE THE HEARING TO PREPARE YOU AND WE WILL LOG INTO ZOOM TOGETHER. \n \nhttp://www.zoom.us/\n \nMEETING ID: {{341_zoom_meeting_id}}\n \nPASSCODE: {{341_zoom_passcode}}\n\n\nI understand you will be nervous, but I assure you the actual hearing is fairly informal. I will be there to walk you through the whole process (or another attorney from the firm). We will call you before the hearing to prepare you. Please have your computer up and running. The Trustee is NOT a Judge. There is a Federal Bankruptcy Judge assigned to your case, but 99% of Debtors never go in front of the Judge. While the hearing is called a \"Meeting of Creditors,\" creditors rarely actually show up to the hearing. You'll be questioned by the Trustee for about 5 minutes. Myself, or one of my attorneys, will meet with you before and after the hearing to make sure all your questions are answered.\n\nTo help calm any nerves you might be experiencing, I have provided you with the list below, so you can prepare yourself well in advance:\n\nTypical questions asked by the Chapter 7 Bankruptcy Trustee:\nState your name\nDo you promise to tell the truth?\nConfirm your address\nDo you owe a Domestic Support Obligation?\nDid you review and sign the bankruptcy paperwork with your attorney?\nIs that information accurate and correct?\nAre there any changes that need to be made?\nDid you list all your assets?\nDid you list all your debts?\nHow did you value certain assets?\nHow much is your rent/mortgage payment?\nAre you current on your mortgage?\nHow many people in your household?\nAre you owed a tax refund?\nIs a copy of the taxes that you provided to your attorney accurate?\nDid you pay family or friends money prior to filing bankruptcy?\nAny major transfers of property in the past few years?\nDo you have a whole life insurance policy?\nAny major changes since you filed bankruptcy?\nWere you being garnished at the time you filed for bankruptcy?\n \nTake a deep breath!\n\nGetting filed is a HUGE step on the road to moving forward with your life. Make sure you are available for the Zoom hearing (this is the only hearing you are required to attend). As always, please text us if you have any questions or concerns."},
    {id:1777905456599,title:"Document request for 341",desc:"Document request for 341",subject:"Document request for 341",body:"Hi {{contact_first_name}},\n \nAs we prepare for your creditor meeting we need some additional documentation that would not have been available to you when we filed your case. Please email us the following documents ASAP (if applicable):\nBank statement showing the balance in all bank accounts on the day the case was filed: \nWe need a complete bank statement for the month which you filed for bankruptcy - this will not be available until after the end of the month in which you filed. \nAll pay stubs that you have received since the case filing date.\n \nAs always, please let us know if you have any questions"},
    {id:1777905529249,title:"341 Hearing Meeting - one week",desc:"341 Hearing Meeting - one week",subject:"341 Hearing Meeting - one week",body:"Hi!\n \nJust a friendly reminder that your Meeting of Creditors is coming up in a week VIA ZOOM.\n \n \n \nWE WILL CALL YOU 30 MINUTES BEFORE THE HEARING TO PREPARE YOU AND WE WILL LOG INTO ZOOM TOGETHER. \n \nhttp://www.zoom.us/\n \nMEETING ID: \n \nPASSCODE: \n \nBelow is a link to the video we sent you immediately after your case was filed. If you haven't already done so, please watch the video below prior to your hearing as Matt gives a lot of information on what happens at the hearing. Below is also a list of questions that the Trustee typically asks.\n \nWATCH VIDEO: WHAT HAPPENS NOW AFTER YOUR CHAPTER 7 CASE IS FILED\n \nTypical questions asked by the Chapter 7 Bankruptcy Trustee include:\nState your name\nDo you promise to tell the truth?\nConfirm your address\nDo you owe a Domestic Support Obligation?\nDid you review and sign the bankruptcy paperwork with your attorney?\nIs that information accurate and correct?\nAre there any changes that need to be made?\nDid you list all your assets?\nDid you list all your debts?\nHow did you value certain assets?\nHow much is your rent/mortgage payment?\nAre you current on your mortgage?\nHow many people in your household?\nAre you owed a tax refund?\nIs a copy of the taxes that you provided to your attorney accurate?\nDid you pay family or friends money prior to filing bankruptcy?\nAny major transfers of property in the past few years?\nDo you have a whole life insurance policy?\nAny major changes since you filed bankruptcy?\nWere you being garnished at the time you filed for bankruptcy?\n \nI understand you will be nervous, but I assure you the actual hearing is fairly informal. I will be there to walk you through the whole process (or another attorney from the firm). We will call you before the hearing to prepare you. Please have your computer up and running. The Trustee is NOT a Judge. There is a Federal Bankruptcy Judge assigned to your case, but 99% of Debtors never go in front of the Judge. While the hearing is called a \"Meeting of Creditors,\" creditors rarely actually show up to the hearing. You'll be questioned by the Trustee for about 5 minutes. Myself, or one of my attorneys, will meet with you before and after the hearing to make sure all your questions are answered.\n \nAs always, let us know if you have any questions or concerns. \n"},
    {id:1777905603274,title:"341 Creditor Meeting Tomorrow",desc:"341 Creditor Meeting Tomorrow",subject:"341 Creditor Meeting Tomorrow",body:"Hi \n\nJust a friendly reminder that your Meeting of Creditors is coming up TOMORROW VIA ZOOM. \n \n\nWE WILL CALL YOU 30 MINUTES BEFORE THE HEARING TO PREPARE YOU AND WE WILL LOG INTO ZOOM TOGETHER. \n \nwww.zoom.us\n \nMEETING ID: \n \nPASSCODE: \n \n \nBelow is a link to the video we sent you immediately after your case was filed. If you haven't already done so, please watch the video below prior to your hearing as Matt gives a lot of information on what happens at the hearing. Below is also a list of questions that the Trustee typically asks.\n \nWHAT HAPPENS NOW AFTER YOUR CHAPTER 7 CASE IS FILED\n \nTypical questions asked by the Chapter 7 Bankruptcy Trustee include:\nState your name\nDo you promise to tell the truth?\nConfirm your address\nDo you owe a Domestic Support Obligation?\nDid you review and sign the bankruptcy paperwork with your attorney?\nIs that information accurate and correct?\nAre there any changes that need to be made?\nDid you list all your assets?\nDid you list all your debts?\nHow did you value certain assets?\nHow much is your rent/mortgage payment?\nAre you current on your mortgage?\nHow many people in your household?\nAre you owed a tax refund?\nIs a copy of the taxes that you provided to your attorney accurate?\nDid you pay family or friends money prior to filing bankruptcy?\nAny major transfers of property in the past few years?\nDo you have a whole life insurance policy?\nAny major changes since you filed bankruptcy?\nWere you being garnished at the time you filed for bankruptcy?\n \nI understand you will be nervous, but I assure you the actual hearing is fairly informal. I will be there to walk you through the whole process (or another attorney from the firm). We will call you before the hearing to prepare you. Please have your computer up and running. The Trustee is NOT a Judge. There is a Federal Bankruptcy Judge assigned to your case, but 99% of Debtors never go in front of the Judge. While the hearing is called a \"Meeting of Creditors,\" creditors rarely actually show up to the hearing. You'll be questioned by the Trustee for about 5 minutes. Myself, or one of my attorneys, will meet with you before and after the hearing to make sure all your questions are answered.\n \nAs always, let us know if you have any questions or concerns. "},
    {id:1777905687250,title:"Follow-Up: 341 Creditor Meeting completed",desc:"Follow-Up: 341 Creditor Meeting completed",subject:"Follow-Up: 341 Creditor Meeting completed",body:"Hello,\n \nYour Section 341 Creditor Meeting is now over. For most debtors, this is the only hearing you have\nto actually attend!\n \nPlease watch the video below where Matt explains what happens now after the creditor meeting:\n \nMATT MCCUNE: CHAPTER 7 WHAT HAPPENS NOW AFTER YOUR HEARING\n \nYour creditors or the Trustee have 60 days to file an objection to any of your debt being\ndischarged in a Chapter 7 case. This is rare but does happen for certain reasons (alleged fraud) or\nif the US Trustee thinks you should be in a Chapter 13. No news is good news for the next 60\ndays!\n \nDuring this time, you need to complete your required second counseling class. You are not\neligible for your discharge unless you complete the class. You must complete the class within the next 60 days!\n \nThe following link will take you to the website where you can complete the\nREQUIRED post-bankruptcy filing financial management/debtor education class.\nMake sure you use my attorney code (449858) so you don't have to pay for the\nclass: \n \nTAKE DEBTOR EDUCATION COURSE HERE\n \nIf the Trustee requests any documentation we must submit it timely. If there are issues\nrelated to potential non-exempt assets these issues should be resolved in the coming\nmonths.\n \nAssuming everything goes well, your Discharge is approximately only three months away!\nHopefully, your FRESH START is right around the corner. I will continue to work diligently to\nensure the Discharge enters!\n \nAs always, please feel free to reach out to us with any questions!\n\n\n"},
    {id:1777905749534,title:"Discharge Entered",desc:"Discharge Entered",subject:"Discharge Entered",body:"\n\nHello!\n\nYour Discharge is attached! Congrats! It has been a pleasure helping you move forward.\n\nYour case is not over yet and it is important that you follow up with the Trustee on any request they might have to turnover non-exempt assets (usually a portion of your tax refund). We must cooperate with the Trustee or the Trustee has the power down the road to \"revoke\" your Discharge. \n\nAs always, please feel free to let me know if you have any questions. \n\nPS - Be on the lookout for creditors (especially debt collectors) that will try to collect debts from you that were discharged in the bankruptcy. That is illegal! We can sue them and recover financial damages from them (it happens a lot). \n\nCLICK HERE TO SEE SPECIAL MESSAGE FROM MATT MCCUNE\n\nI'd really appreciate it if you would leave my firm a review on Google. It really helps with our marketing efforts.\n\nBest of luck in the future! It has been a pleasure working with you. \n\nLEAVE MCCUNE LEGAL A 5 STAR GOOGLE REVIEW\n"},
    {id:1777905945185,title:"Your Chapter 7 Case Has Been Closed",desc:"Your Chapter 7 Case Has Been Closed",subject:"Your Chapter 7 Case Has Been Closed",body:"Hi {{contact_first_name}},\n\nYour Chapter 7 bankruptcy case has now officially been closed by the court. Your discharge has already been entered, which means that many of your eligible unsecured debts have been permanently eliminated. This is the final step in the bankruptcy process, and we hope this gives you the opportunity for a true financial fresh start.\n\nPlease remember that certain categories of debt are generally not discharged in bankruptcy, including some student loans, certain taxes, domestic support obligations, and certain government fines or penalties. If you have questions regarding your student loans, please contact our office. In some situations, it may be possible to pursue a separate legal action called an adversary proceeding to seek relief from student loan debt.\n\nAs you move forward, one of the best ways to rebuild your credit is to make all future payments on time, keep credit balances low, regularly review your credit reports for accuracy, and avoid taking on unnecessary debt. Many clients are surprised by how quickly they are able to begin rebuilding their credit profile after bankruptcy.\n\nThank you again for allowing us to assist you through this process. If you have any questions in the future, please do not hesitate to contact our office."},
    {id:1777906586827,title:"Next Steps After Our Consultation #1",desc:"Next Steps After Our Consultation #1",subject:"Next Steps After Our Consultation",body:"Hi {{contact_first_name}},\n\nIt was good speaking with you earlier. Based on what we discussed, it sounds like bankruptcy may be a strong option to help you move forward.\n\nIf you'd like to proceed, the next step is to complete the intake and begin gathering documents so we can prepare your case efficiently.\n\nLet me know if you have any questions—I'm happy to help."},
    {id:1777906689067,title:"Next Steps After Our Consultation #2",desc:"Next Steps After Our Consultation #2",subject:"Following Up – You Have Options",body:"Hi {{contact_first_name}},\n\nI know this isn't an easy situation, and I appreciate you taking the time to speak with me.\n\nJust a quick note to follow up—if you decide to move forward, we can help guide you through the process step by step and make this as smooth as possible.\n\nNo pressure at all—just let me know how you'd like to proceed or if anything comes up."},
    {id:1777906751764,title:"Next Steps After Our Consultation #3",desc:"Next Steps After Our Consultation #3",subject:"Ready When You Are",body:"Hi {{contact_first_name}},\n\nJust checking in after our consultation.\n\nIf you're ready to move forward, getting started sooner typically puts you in a better position—especially if there are collection actions or deadlines approaching.\n\nWe can begin as soon as you're ready. Let me know and I'll send over the next steps."}
  ],
  sequences:[
    {id:1,title:"New Client Onboarding",desc:"5 steps • 8 active clients",meta:"Active"},
    {id:2,title:"Document Collection",desc:"3 steps • 4 active clients",meta:"Active"},
    {id:3,title:"Post-Filing Follow-up",desc:"4 steps • 2 active clients",meta:"Paused"}
  ],
