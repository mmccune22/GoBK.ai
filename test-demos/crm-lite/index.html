/* Printable AI INTAKE SUMMARY — the AI's analysis of what the debtor submitted.
   This is what the debtor receives (after law firm approval). Distinct from the Intake Package,
   which is the raw record of every answer. */
function buildIntakeSummaryHtml(lead,pkg){
  const money=(n)=>typeof n==="number"?fmt(n):(n||"—");
  const totInc=(pkg.income||[]).reduce((a,x)=>a+(x.monthly||0),0);
  const totExp=(pkg.expenses||[]).reduce((a,x)=>a+(x.monthly||0),0);
  const totAssets=(pkg.assets||[]).reduce((a,x)=>a+(x.value||0),0);
  const totDebt=(pkg.debts||[]).reduce((a,x)=>a+(x.balance||0),0);
  const secured=(pkg.debts||[]).filter(d=>d.type==="secured").reduce((a,x)=>a+(x.balance||0),0);
  const unsecured=(pkg.debts||[]).filter(d=>d.type==="unsecured").reduce((a,x)=>a+(x.balance||0),0);
  const priority=(pkg.debts||[]).filter(d=>d.type==="priority").reduce((a,x)=>a+(x.balance||0),0);
  let b="";
  b+="<h2>What You Told Us</h2><p><strong>Your goals:</strong> "+(pkg.goals||"—")+"</p><p><strong>Your most urgent concern:</strong> "+(pkg.concerns||"—")+"</p>";
  b+="<h2>Your Numbers at a Glance</h2><table>";
  b+="<tr><th>Monthly income</th><td>"+money(totInc)+"</td></tr>";
  b+="<tr><th>Monthly expenses</th><td>"+money(totExp)+"</td></tr>";
  b+="<tr><th>Total assets</th><td>"+money(totAssets)+"</td></tr>";
  b+="<tr><th>Total debt</th><td>"+money(totDebt)+" (secured "+money(secured)+" &middot; unsecured "+money(unsecured)+" &middot; priority "+money(priority)+")</td></tr>";
  b+="</table>";
  const mtx=computeMeansDemo(lead,pkg);
  b+="<h2>Preliminary Means Test</h2>";
  if(mtx.months===0){
    b+="<p>We can\u2019t run your preliminary means test yet \u2014 it needs your pay stubs. Once we receive them, this section will be updated.</p>";
  }else{
    b+="<p>Based on "+mtx.months+" of 6 months of pay stubs, your household income of "+fmt(mtx.annual)+" per year appears to be <strong>"+(mtx.below?"below":"above")+"</strong> the median for a household of "+mtx.hh+" in your state ("+fmt(mtx.median)+"). "+(mtx.months<6?"This is an early read \u2014 the remaining pay stubs may change it. ":"")+"Your attorney will confirm this as part of their review.</p>";
  }
  b+="<h2>Counseling Class</h2><p>"+(pkg.counseling||"—")+"</p>";
  b+="<h2>What Happens Next</h2><p>Our team is now reviewing everything you submitted, including each of your documents. If we need anything else from you, you\u2019ll receive a separate email with a secure link to your client portal. If anything above looks wrong, or your situation changes, reply to this email or call our office — corrections now save time later.</p>";
  return "<html><head><title>AI Intake Summary — "+lead.firstName+" "+lead.lastName+"</title><style>"+
    "body{font-family:'Inter','Segoe UI',Arial,sans-serif;color:#333;max-width:700px;margin:0 auto;padding:36px;line-height:1.6;font-size:13px;}"+
    "h1{font-size:19px;color:#3d5c43;border-bottom:2px solid #7a9c80;padding-bottom:8px;margin:0 0 4px;}"+
    ".meta{font-size:11px;color:#888;margin:0 0 22px;}"+
    "h2{font-size:14px;color:#3d5c43;margin:20px 0 6px;}"+
    "table{border-collapse:collapse;margin:4px 0 8px;}th{text-align:left;color:#666;padding:5px 18px 5px 0;font-size:12.5px;}td{padding:5px 0;font-weight:600;}"+
    "ul{margin:4px 0 8px 20px;}p{margin:4px 0 8px;}"+
    ".disclaimer{background:#faf7ef;border:1px solid #d9cfa8;border-radius:6px;padding:10px 14px;font-size:11.5px;color:#6b6349;line-height:1.55;margin:0 0 18px;}"+
    "@media print{body{padding:0;}}"+
    "</style></head><body><h1>AI Intake Summary</h1><div class='meta'>Prepared for "+lead.firstName+" "+lead.lastName+" &middot; Intake submitted "+(pkg.submitted||"")+" &middot; Reviewed and approved by McCune Legal</div>"+"<div class='disclaimer'><strong>A note about this summary:</strong> it was prepared with the assistance of artificial intelligence, based on the information and documents you provided. It is a preliminary overview only \u2014 not legal advice \u2014 and it does not reflect a final review of your case. Your attorney will personally review your complete file, and the figures, documents, and next steps described here may change after that review.</div>"+b+"</body></html>";
}

/* Printable intake package — all intake answers in one document (save as PDF from the print dialog) */
function buildIntakePackageHtml(lead,pkg){

  const row=(cells,th)=>"<tr>"+cells.map(c=>"<"+(th?"th":"td")+">"+(c===0?"$0":(c||c===0?c:"—"))+"</"+(th?"th":"td")+">").join("")+"</tr>";
  const table=(head,rows)=>"<table>"+row(head,true)+rows.join("")+"</table>";
  let b="";
  b+="<h2>Submission Summary</h2>"+table(["Lead","Submitted","Court"],[row([lead.firstName+" "+lead.lastName,pkg.submitted,pkg.court])]);
  b+="<p><strong>Client goals:</strong> "+(pkg.goals||"—")+"</p><p><strong>Urgent concerns:</strong> "+(pkg.concerns||"—")+"</p><p><strong>Counseling class:</strong> "+(pkg.counseling||"—")+"</p>";

  b+="<h2>Debtors &amp; Household</h2>"+table(["Debtor","DOB","SSN","Contact","Address"],(h.debtors||[]).map(d=>row([d.name,d.dob,d.ssn,(d.email||"")+"<br>"+(d.phone||""),d.address])));

function buildEmptyCF(scope,bkType,overrides){

  const obj={};

}

function ConfirmModal({open,title,message,confirmLabel,onConfirm,onCancel}){

          <div style={{width:40,height:40,borderRadius:10,background:"#fde8e8",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#dc3545" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
          <h3 style={{fontSize:17,fontWeight:700,color:"#434343",margin:0}}>{title||"Confirm Delete"}</h3>
        </div>
        <p style={{fontSize:14,color:"#555",lineHeight:1.6,margin:"0 0 24px 0"}}>{message||"Are you sure? This action cannot be undone."}</p>
        <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
          <button onClick={onCancel} style={{padding:"9px 22px",fontSize:13,fontWeight:600,border:"1px solid #d0d0d0",borderRadius:8,background:"#fff",color:"#434343",cursor:"pointer"}}>Cancel</button>
          <button onClick={onConfirm} style={{padding:"9px 22px",fontSize:13,fontWeight:600,border:"none",borderRadius:8,background:"#dc3545",color:"#fff",cursor:"pointer"}}>{confirmLabel||"Delete"}</button>
        </div>
      </div>
    </div>
  );
}
function useConfirm(){
  const [state,setState]=React.useState({open:false,title:"",message:"",confirmLabel:"",resolve:null});
  const confirm=React.useCallback((opts)=>{
    return new Promise((resolve)=>{setState({open:true,title:opts.title||"Confirm Delete",message:opts.message||"Are you sure? This action cannot be undone.",confirmLabel:opts.confirmLabel||"Delete",resolve});});
  },[]);
  const handleConfirm=React.useCallback(()=>{if(state.resolve)state.resolve(true);setState(s=>({...s,open:false}));},[state.resolve]);
  const handleCancel=React.useCallback(()=>{if(state.resolve)state.resolve(false);setState(s=>({...s,open:false}));},[state.resolve]);
  const modal=React.createElement(ConfirmModal,{open:state.open,title:state.title,message:state.message,confirmLabel:state.confirmLabel,onConfirm:handleConfirm,onCancel:handleCancel});
  return [confirm,modal];
}

/* ─── TOP BAR ─── */
function TopBar({leads,setLeads,matters,setMatters,standaloneContacts,setStandaloneContacts,setPage,setSelectedMatter,setSelectedLead}){
  const dynamicLeadStages=LEAD_STAGES;
  const dynamicMatterStages=(()=>{try{const s=localStorage.getItem("bkfl_lite_matter_stages");if(s)return JSON.parse(s);}catch(e){}return MATTER_STAGES;})();
  const [showCreateMenu,setShowCreateMenu]=useState(false);
  const [showNewRecord,setShowNewRecord]=useState(null); // "Lead" or "Matter"
  const [showContactOnly,setShowContactOnly]=useState(false);
  const [contactOnlyForm,setContactOnlyForm]=useState({firstName:"",middleName:"",lastName:"",email:"",phone:"",role:"Other"});
  const [searchQuery,setSearchQuery]=useState("");
  const [searchFocused,setSearchFocused]=useState(false);

  const searchResults=useMemo(()=>{
    if(!searchQuery.trim())return[];
    const q=searchQuery.toLowerCase();
    const results=[];
    // Search matters by client name and email
    (matters||[]).forEach(m=>{
      const name=(m.clientFullName||m.clientName||"").toLowerCase();
      const email=(m.email||"").toLowerCase();
      if(name.includes(q)||email.includes(q)){
        results.push({type:"matter",id:m.id,name:m.clientFullName||m.clientName,email:m.email||"",sub:m.description||m.bankruptcyType,status:m.matterStage});
      }
    });
    // Search leads by name and email
    (leads||[]).forEach(l=>{
      const name=(l.firstName+" "+l.lastName).toLowerCase();
      const email=(l.email||"").toLowerCase();
      if(name.includes(q)||email.includes(q)){
        results.push({type:"lead",id:l.id,name:l.firstName+" "+l.lastName,email:l.email||"",sub:l.bankruptcyType,status:l.leadStage});
      }
    });
    return results.slice(0,8);
  },[searchQuery,matters,leads]);
  // Unified new record form state
  const [contactMode,setContactMode]=useState("new"); // "new" or "existing"
  const [selectedExistingContact,setSelectedExistingContact]=useState(null);
  const [contactSearch,setContactSearch]=useState("");
  const [newRecordForm,setNewRecordForm]=useState({firstName:"",middleName:"",lastName:"",email:"",phone:"",bankruptcyType:"Chapter 7",leadStage:"New Lead",notes:"",isJoint:false,sendIntake:false,joint:{firstName:"",middleName:"",lastName:"",email:"",phone:""}});
  // Gather all contacts from matters+leads+standalone for "existing contact" search
  const allContacts=useMemo(()=>{
    const cs=[];
    (matters||[]).forEach(m=>(m.contacts||[]).forEach(c=>cs.push({...c,source:"Matter",sourceName:m.clientFullName||m.clientName,sourceId:m.id})));
    (leads||[]).forEach(l=>(l.contacts||[]).forEach(c=>cs.push({...c,source:"Lead",sourceName:l.firstName+" "+l.lastName,sourceId:l.id})));
    (standaloneContacts||[]).forEach(c=>cs.push({...c,source:"Contact",sourceName:"Contact",sourceId:null}));
    // Deduplicate by name+email
    const seen=new Set();
    return cs.filter(c=>{const k=(c.name||"")+(c.email||"");if(seen.has(k))return false;seen.add(k);return true;});
  },[matters,leads,standaloneContacts]);
  const filteredContacts=useMemo(()=>{
    if(!contactSearch.trim())return allContacts.slice(0,8);
    const q=contactSearch.toLowerCase();
    return allContacts.filter(c=>(c.name||"").toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q)).slice(0,8);
  },[contactSearch,allContacts]);
  const resetNewRecordForm=()=>{setNewRecordForm({firstName:"",middleName:"",lastName:"",email:"",phone:"",bankruptcyType:"Chapter 7",leadStage:"New Lead",notes:"",isJoint:false,sendIntake:false,joint:{firstName:"",middleName:"",lastName:"",email:"",phone:""}});setContactMode("new");setSelectedExistingContact(null);setContactSearch("");};
  const inputStyle={width:"100%",padding:"10px 12px",fontSize:13,border:"1px solid #d0d0d0",borderRadius:6,outline:"none",fontFamily:"inherit"};
  const labelStyle={fontSize:12,fontWeight:600,color:"#555",marginBottom:4,display:"block"};
  return(
    <React.Fragment>
    <header style={{height:56,background:"#e7eae5",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 24px",position:"sticky",top:0,zIndex:15,borderBottom:"1px solid rgba(0,0,0,0.08)"}}>
      <div style={{flex:1,maxWidth:500,position:"relative"}}>
        <div style={{display:"flex",alignItems:"center",background:"rgba(0,0,0,0.06)",borderRadius:8,padding:"7px 14px",gap:8}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="rgba(0,0,0,0.35)" strokeWidth="1.8"/><path d="M21 21l-4.35-4.35" stroke="rgba(0,0,0,0.35)" strokeWidth="1.8" strokeLinecap="round"/></svg>

              </div>

                {cl.length>0&&<span style={{background:"#fff",color:"#3d5c43",border:"1px solid #9bba9f",borderRadius:6,padding:"5px 12px",fontSize:12,fontWeight:600}}>{docsIn} of {cl.length} documents</span>}
                {(pkg.flags||[]).length>0&&<span style={{background:"#fef3cd",color:"#856404",border:"1px solid #ffc107",borderRadius:6,padding:"5px 12px",fontSize:12,fontWeight:600}}>{pkg.flags.length} review flag{pkg.flags.length===1?"":"s"}</span>}
                <span style={{background:"#7A9C80",color:"#fff",borderRadius:6,padding:"5px 12px",fontSize:12,fontWeight:600}}>Ready for law firm review</span>
                <button onClick={printIntakePackage} style={{background:"#7a9c80",color:"#fff",border:"none",borderRadius:6,padding:"7px 16px",fontSize:12.5,fontWeight:700,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#5a7c60"} onMouseLeave={e=>e.currentTarget.style.background="#7a9c80"}>Save as PDF</button>
              </div>
            </div>

            <Sec title="Submission Summary" right={"Submitted "+(pkg.submitted||"—")}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}}>
                <div style={{padding:"12px 20px",borderRight:"1px solid #f5f5f5"}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>Client Goals</div>
                  <div style={{fontSize:13,color:"#434343",lineHeight:1.55}}>{pkg.goals||"—"}</div>
                </div>
                <div style={{padding:"12px 20px"}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:"#c0392b",textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>Urgent Concerns</div>
                  <div style={{fontSize:13,color:"#434343",lineHeight:1.55}}>{pkg.concerns||"—"}</div>
                </div>
              </div>
              <div style={{padding:"10px 20px",borderTop:"1px solid #f5f5f5",fontSize:12,color:"#666"}}>Court: <strong style={{color:"#434343"}}>{pkg.court||"—"}</strong> &nbsp;&nbsp;·&nbsp;&nbsp; Counseling class: <strong style={{color:"#434343"}}>{pkg.counseling||"—"}</strong></div>
            </Sec>

            <Sec title="Debtors & Household" right={((pkg.household||{}).debtors||[]).length+" debtor"+(((pkg.household||{}).debtors||[]).length===1?"":"s")+" · "+((pkg.household||{}).dependents!=null?(pkg.household.dependents+" dependent"+(pkg.household.dependents===1?"":"s")):"")}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Debtor</th><th style={thS}>Date of Birth</th><th style={thS}>SSN</th><th style={thS}>Contact</th><th style={thS}>Address</th></tr></thead>
                <tbody>{((pkg.household||{}).debtors||[]).map((d,i)=>(<tr key={i}><td style={{...tdS,fontWeight:600}}>{d.name}</td><td style={tdS}>{d.dob}</td><td style={tdS}>{d.ssn}</td><td style={tdS}>{d.email}<br/>{d.phone}</td><td style={tdS}>{d.address}</td></tr>))}</tbody>
              </table>
              <div style={{padding:"10px 20px",fontSize:12.5,color:"#555"}}><strong>Marital status:</strong> {(pkg.household||{}).maritalStatus||"—"} &nbsp;&nbsp; <strong>Joint filing:</strong> {(pkg.household||{}).jointFiling||"—"} &nbsp;&nbsp; <strong>Dependents:</strong> {(pkg.household||{}).dependents!=null?pkg.household.dependents:"—"}</div>
            </Sec>

            <Sec title="Income & Expenses" right={money(totInc)+" income / "+money(totExp)+" expenses monthly"}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Source</th><th style={thS}>Employer</th><th style={thS}>Frequency</th><th style={thS}>Monthly</th><th style={thS}>Six-Month Total</th></tr></thead>
                <tbody>{(pkg.income||[]).map((x,i)=>(<tr key={i}><td style={{...tdS,fontWeight:600}}>{x.source}</td><td style={tdS}>{x.employer}</td><td style={tdS}>{x.frequency}</td><td style={tdS}>{money(x.monthly)}</td><td style={tdS}>{money(x.sixMonth)}</td></tr>))}</tbody>
              </table>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Expense</th><th style={thS}>Monthly</th><th style={thS}>Notes</th></tr></thead>
                <tbody>{(pkg.expenses||[]).map((x,i)=>(<tr key={i}><td style={tdS}>{x.name}</td><td style={tdS}>{money(x.monthly)}</td><td style={{...tdS,color:"#888"}}>{x.notes||"—"}</td></tr>))}</tbody>
              </table>
            </Sec>

            <Sec title="Property & Debts" right={money(totAssets)+" assets / "+money(totDebt)+" debt"}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Asset</th><th style={thS}>Category</th><th style={thS}>Value</th><th style={thS}>Lien</th><th style={thS}>Intent</th></tr></thead>
                <tbody>{(pkg.assets||[]).map((x,i)=>(<tr key={i}><td style={{...tdS,fontWeight:600}}>{x.name}</td><td style={tdS}>{x.category}</td><td style={tdS}>{money(x.value)}</td><td style={tdS}>{x.lien?money(x.lien):"$0"}</td><td style={{...tdS,color:"#666"}}>{x.intent||"—"}</td></tr>))}</tbody>
              </table>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Creditor</th><th style={thS}>Type</th><th style={thS}>Balance</th><th style={thS}>Arrears</th><th style={thS}>Collateral</th></tr></thead>
                <tbody>{(pkg.debts||[]).map((x,i)=>(<tr key={i}><td style={{...tdS,fontWeight:600}}>{x.creditor}</td><td style={tdS}><span style={{padding:"1px 8px",borderRadius:4,fontSize:10.5,fontWeight:700,background:x.type==="secured"?"#dce8de":x.type==="priority"?"#fde8e8":"#f0f0ed",color:x.type==="secured"?"#3d5c43":x.type==="priority"?"#c0392b":"#666"}}>{x.type}</span></td><td style={tdS}>{money(x.balance)}</td><td style={tdS}>{x.arrears?money(x.arrears):"$0"}</td><td style={{...tdS,color:"#666"}}>{x.collateral||"—"}</td></tr>))}</tbody>
              </table>
            </Sec>

            <Sec title="Financial Affairs (SOFA)" right={SOFA_QUESTIONS.length+" questions · "+((pkg.sofa||{}).events||[]).length+" reported events"}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Question</th><th style={thS}>Answer</th><th style={thS}>Entries</th></tr></thead>
                <tbody>{SOFA_QUESTIONS.map((qd,i)=>{const v=sofaAnswer(pkg,qd.id);return(<tr key={i} style={{background:v.a==="Yes"?"#fffcf5":"transparent"}}><td style={tdS}>{qd.q}</td><td style={{...tdS,fontWeight:700,color:v.a==="Yes"?"#b8963e":"#434343"}}>{v.a}</td><td style={tdS}>{v.entries||"—"}</td></tr>);})}</tbody>
              </table>
              {((pkg.sofa||{}).events||[]).length>0&&(
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Event</th><th style={thS}>Date</th><th style={thS}>Amount</th><th style={thS}>Description</th></tr></thead>
                <tbody>{pkg.sofa.events.map((x,i)=>(<tr key={i}><td style={{...tdS,fontWeight:600}}>{x.event}</td><td style={tdS}>{x.date}</td><td style={tdS}>{x.amount?money(x.amount):"—"}</td><td style={{...tdS,color:"#666"}}>{x.desc}</td></tr>))}</tbody>
              </table>)}
            </Sec>

            {(pkg.flags||[]).length>0&&(
            <Sec title="Law Firm Review Flags" right={pkg.flags.length+" open"}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr><th style={thS}>Severity</th><th style={thS}>Flag</th><th style={thS}>Section</th><th style={thS}>Detail</th></tr></thead>
                <tbody>{pkg.flags.map((x,i)=>(<tr key={i}><td style={tdS}><span style={{padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:700,background:(sevColor[x.severity]||"#999")+"22",color:sevColor[x.severity]||"#666",border:"1px solid "+(sevColor[x.severity]||"#999")}}>{x.severity}</span></td><td style={{...tdS,fontWeight:600}}>{x.flag}</td><td style={tdS}>{x.section}</td><td style={{...tdS,color:"#666"}}>{x.detail}</td></tr>))}</tbody>
              </table>
            </Sec>)}
          </div>);
        })()}

        {tab==="communications"&&(()=>{
          const emails=(lead.communications||[]).filter(c=>c.type==="Email");
          return(<div>
            {/* Send / log an email */}
            <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",padding:20,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:showEmailCompose?16:0}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:36,height:36,borderRadius:8,background:"#e7eae5",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="#7a9c80" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <div>
                    <div style={{fontSize:14,fontWeight:600,color:"#434343"}}>Email</div>
                    <div style={{fontSize:12,color:"#999"}}>Track outgoing emails to {lead.firstName} {lead.lastName}{lead.email?" ("+lead.email+")":""}</div>
                  </div>
                </div>
                <button onClick={()=>setShowEmailCompose(!showEmailCompose)} style={{padding:"8px 18px",fontSize:13,fontWeight:500,border:"none",borderRadius:6,background:showEmailCompose?"#eee":"#7a9c80",color:showEmailCompose?"#666":"#fff",cursor:"pointer"}}>{showEmailCompose?"Cancel":"New Email"}</button>
              </div>
              {showEmailCompose&&(
                <div>
                  <input value={emailSubject} onChange={e=>setEmailSubject(e.target.value)} placeholder="Subject" style={{width:"100%",padding:"10px 12px",fontSize:13,border:"1px solid #d0d0d0",borderRadius:6,outline:"none",marginBottom:10,fontFamily:"inherit"}}/>
                  <textarea value={emailBody} onChange={e=>setEmailBody(e.target.value)} placeholder="Email body..." rows={4} style={{width:"100%",padding:"10px 12px",fontSize:13,border:"1px solid #d0d0d0",borderRadius:6,outline:"none",resize:"vertical",fontFamily:"inherit",marginBottom:10}}/>
                  <div style={{display:"flex",justifyContent:"flex-end"}}>
                    <button onClick={sendEmail} disabled={!emailBody.trim()||!emailSubject.trim()} style={{padding:"8px 20px",fontSize:13,fontWeight:600,border:"none",borderRadius:6,background:(emailBody.trim()&&emailSubject.trim())?"#7a9c80":"#ccc",color:"#fff",cursor:(emailBody.trim()&&emailSubject.trim())?"pointer":"default"}}>Send Email</button>
                  </div>
                </div>
              )}
            </div>
            {/* Sent email log */}
            <div style={{background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",overflow:"hidden"}}>
              <div style={{padding:"14px 20px",borderBottom:"1px solid #eee",fontSize:14,fontWeight:600,color:"#434343",display:"flex",alignItems:"center",gap:8}}>
                <span>Sent Emails</span>
                <span style={{background:"#7a9c80",color:"#fff",borderRadius:10,padding:"1px 8px",fontSize:11,fontWeight:700}}>{emails.length}</span>
              </div>
              {emails.length===0?<div style={{padding:20,textAlign:"center",color:"#999",fontSize:13}}>No emails tracked yet.</div>:
              emails.map(c=>(
                <div key={c.id} style={{padding:"12px 20px",borderBottom:"1px solid #f5f5f5"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:13,fontWeight:600,color:"#434343"}}>{c.subject}</span>
                    <span style={{fontSize:11,color:"#999"}}>{c.date?new Date(c.date+"T12:00:00").toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}):""}</span>
                  </div>
                  <div style={{fontSize:11,color:"#999"}}>{c.direction||"Outgoing"}{c.to?" — to "+c.to:""}</div>
                  {c.body&&<div style={{fontSize:12,color:"#666",marginTop:6,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{c.body}</div>}
                </div>
              ))}
            </div>
          </div>);
        })()}

        {tab==="ai"&&(<LeadAITab lead={lead}/>)}
      </div>


      {resendModal&&(()=>{const spec=EMAIL_TASKS["Send the intake link"];return(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:60}} onClick={()=>setResendModal(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:12,width:620,maxWidth:"92vw",maxHeight:"86vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.3)",padding:"18px 24px"}}>
            <div style={{fontSize:10.5,fontWeight:700,color:"#7a9c80",textTransform:"uppercase",letterSpacing:"0.6px",marginBottom:8}}>{resendModal==="resend"?"Re-send Intake Form Link":"Intake Form Link"} {"\u2014"} reviewed before it sends</div>
            {resendModal==="resend"&&<div style={{fontSize:12,color:"#856404",background:"#fdf6e7",border:"1px solid #e5cf8f",borderRadius:6,padding:"8px 12px",marginBottom:10,lineHeight:1.5}}>Re-sending the same intake link {"\u2014"} nothing else changes: no Stage move, no new Task. The weekly follow-up keeps running on its own schedule.</div>}
            <div style={{display:"grid",gridTemplateColumns:"64px 1fr",rowGap:4,columnGap:10,fontSize:12.5,marginBottom:10}}>
              <span style={{color:"#999",fontWeight:600}}>To</span><span style={{color:"#434343"}}>{lead.firstName} {lead.lastName} {"\u00b7"} {lead.email}</span>
              <span style={{color:"#999",fontWeight:600}}>Subject</span><span style={{color:"#434343",fontWeight:600}}>{spec.subject}</span>
            </div>
            <div style={{background:"#FBFAF7",border:"1px solid #e0e0e0",borderRadius:8,padding:"12px 14px",fontSize:12.5,color:"#555",lineHeight:1.6,whiteSpace:"pre-wrap",marginBottom:12}}>{spec.body(lead)}</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setResendModal(null)} style={{padding:"6px 14px",fontSize:12,fontWeight:600,borderRadius:5,cursor:"pointer",border:"1px solid #d0d0d0",background:"#fff",color:"#555"}}>Cancel</button>
              <button onClick={approveSendIntake} style={{padding:"6px 16px",fontSize:12,fontWeight:600,borderRadius:5,cursor:"pointer",border:"none",background:"#7a9c80",color:"#fff"}}>Approve &amp; Send</button>
            </div>
          </div>
        </div>);})()}
      {leadTaskModal&&<TaskApprovalModal task={leadTaskModal} lead={lead} onClose={()=>setLeadTaskModal(null)} onApprove={(tk)=>{update(buildApprovalPatch(lead,tk));setLeadTaskModal(null);}}/>}
      {taskNotifyPopup&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.35)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}>
          <div style={{background:"#fff",borderRadius:12,padding:"32px 36px",maxWidth:420,width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
            <h3 style={{fontSize:16,fontWeight:700,color:"#434343",marginBottom:8}}>Notify Client</h3>
            <p style={{fontSize:13,color:"#666",marginBottom:20,lineHeight:1.5}}>Task <strong>"{taskNotifyPopup.title}"</strong> has been assigned to <strong>{taskNotifyPopup.assignee}</strong>. How would you like to notify them?</p>
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <button onClick={()=>{alert("Email notification sent to "+taskNotifyPopup.assignee);setTaskNotifyPopup(null);}} style={{flex:1,padding:"10px 16px",fontSize:13,fontWeight:600,border:"1px solid #d0d0d0",borderRadius:6,background:"#fff",color:"#434343",cursor:"pointer"}}>Email</button>
              <button onClick={()=>{alert("Text notification sent to "+taskNotifyPopup.assignee);setTaskNotifyPopup(null);}} style={{flex:1,padding:"10px 16px",fontSize:13,fontWeight:600,border:"1px solid #d0d0d0",borderRadius:6,background:"#fff",color:"#434343",cursor:"pointer"}}>Text</button>
              <button onClick={()=>{alert("Magic Link sent to "+taskNotifyPopup.assignee);setTaskNotifyPopup(null);}} style={{flex:1,padding:"10px 16px",fontSize:13,fontWeight:600,border:"none",borderRadius:6,background:"#7a9c80",color:"#fff",cursor:"pointer"}}>Magic Link</button>
            </div>
            <button onClick={()=>setTaskNotifyPopup(null)} style={{width:"100%",padding:"8px",fontSize:12,color:"#888",background:"none",border:"none",cursor:"pointer"}}>Skip — Don't notify</button>
          </div>
        </div>
      )}
      {/* Edit Lead Modal */}
      {editingLead&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={()=>setEditingLead(false)}>
          <div style={{background:"#fff",borderRadius:12,padding:"28px 32px",width:480,maxWidth:"90vw",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:18,fontWeight:700,color:"#434343",margin:0}}>Edit Lead</h3>
              <div style={{cursor:"pointer",fontSize:20,color:"#999",lineHeight:1}} onClick={()=>setEditingLead(false)}>&times;</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
              <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>First Name</label><input type="text" value={editForm.firstName||""} onChange={e=>setEditForm({...editForm,firstName:e.target.value})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
              <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Last Name</label><input type="text" value={editForm.lastName||""} onChange={e=>setEditForm({...editForm,lastName:e.target.value})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
              <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Email</label><input type="email" value={editForm.email||""} onChange={e=>setEditForm({...editForm,email:e.target.value})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
              <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Phone</label><input type="tel" value={editForm.phone||""} onChange={e=>setEditForm({...editForm,phone:e.target.value})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#434343",cursor:"pointer"}}>
                <input type="checkbox" checked={editForm.isJoint||false} onChange={e=>setEditForm({...editForm,isJoint:e.target.checked,joint:editForm.joint||{firstName:"",lastName:"",email:"",phone:""}})} style={{accentColor:"#7A9C80"}}/>
                <span style={{fontWeight:600}}>Joint Case</span><span style={{color:"#888",fontWeight:400}}>(second contact)</span>
              </label>
            </div>
            {editForm.isJoint&&(
              <div style={{background:"#f9faf8",border:"1px solid #e0e0e0",borderRadius:8,padding:14,marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:"#7A9C80",marginBottom:10}}>Second Contact (Spouse/Joint Filer)</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:10}}>
                  <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>First Name</label><input type="text" value={(editForm.joint||{}).firstName||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),firstName:e.target.value}})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
                  <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Last Name</label><input type="text" value={(editForm.joint||{}).lastName||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),lastName:e.target.value}})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                  <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Email</label><input type="email" value={(editForm.joint||{}).email||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),email:e.target.value}})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
                  <div><label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Phone</label><input type="tel" value={(editForm.joint||{}).phone||""} onChange={e=>setEditForm({...editForm,joint:{...(editForm.joint||{}),phone:e.target.value}})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box"}}/></div>
                </div>
              </div>
            )}
            <div style={{marginBottom:20}}>
              <label style={{fontSize:12,fontWeight:600,color:"#666",marginBottom:4,display:"block"}}>Notes</label>
              <textarea value={editForm.leadNotes||""} onChange={e=>setEditForm({...editForm,leadNotes:e.target.value})} style={{width:"100%",padding:"9px 12px",borderRadius:6,border:"1px solid #d0d0d0",fontSize:13,boxSizing:"border-box",minHeight:60,resize:"vertical"}}/>
            </div>
            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>setEditingLead(false)} style={{padding:"10px 20px",fontSize:13,fontWeight:500,border:"1px solid #d0d0d0",borderRadius:6,background:"#fff",color:"#434343",cursor:"pointer"}}>Cancel</button>
              <button onClick={saveEditLead} style={{padding:"10px 20px",fontSize:13,fontWeight:500,border:"none",borderRadius:6,background:"#7a9c80",color:"#fff",cursor:"pointer"}}>Save Changes</button>
            </div>
          </div>
        </div>
      )}
      {confirmModal}
    </div>
  );
}

/* ─── DASHBOARD PAGE ─── */
function AITab({item,isLead,update}){
  const itemName=isLead?item.firstName+" "+item.lastName:item.clientFullName||item.clientName;
  const stage=isLead?item.leadStage:item.matterStage;
  const bkType=item.bankruptcyType||"Chapter 7";

  // Means Test data from item or defaults
  const mt=item.meansTest||{};
  const cmi=mt.cmi||item.monthlyIncome||0;
  const householdSize=mt.householdSize||1;
  // Median income thresholds by household size (2025 Census / DOJ)
  const medianThresholds={1:63957,2:83476,3:97234,4:114663,5:124663,6:134663};
  const medianThreshold=mt.medianThreshold||(medianThresholds[householdSize]||medianThresholds[1]);
  const annualizedIncome=cmi*12;
  const belowMedian=annualizedIncome<=medianThreshold;
  const deductions=mt.deductions||0;
  const adjustedCAI=belowMedian?0:Math.max(0,cmi-deductions);
  const passes=belowMedian||adjustedCAI<=0;

  // Confidence Score: 20 base + up to 60 for pay stubs (10 per month) + 20 for tax doc match
  const payStubMonths=Math.min(6,parseInt(mt.payStubMonths)||0);
  const taxMatch=mt.taxMatch||false;
  const confidenceScore=Math.min(100,20+(payStubMonths*10)+(taxMatch?20:0));
  const confidenceColor=confidenceScore>=80?"#3d5c43":confidenceScore>=50?"#FF9800":"#c0392b";
  const confidenceLevel=confidenceScore>=80?"High":confidenceScore>=50?"Medium":"Low";
  const confidenceExplanation=confidenceScore>=80?"Strong documentation supports this analysis. Pay stubs and tax records are well-matched.":confidenceScore>=50?"Moderate documentation received. Additional pay stubs or tax verification would strengthen confidence.":"Limited documentation available. Analysis reliability is low until more records are provided.";

  const saveMeansTest=(field,val)=>{
    const updated={...mt,[field]:parseFloat(val)||0};
    if(update)update({meansTest:updated});
  };

  // Recommendations based on stage
  const getRecs=()=>{
    const r=[];
    if(isLead){
      if(stage==="New Lead"){r.push("Schedule initial consultation","Send intake form to client","Run preliminary means test","Verify income documents");}
      else if(stage==="Consult Scheduled"){r.push("Prepare consultation questions","Review client credit report","Estimate case complexity");}
      else if(stage==="Pending Engagement"){r.push("Send engagement letter","Collect required documents","Schedule signing appointment");}
      else{r.push("Order credit report","Send intake form","Schedule credit counseling");}
    }else{
      if(stage.includes("Pending Documents")){r.push("Send document collection list","Request missing exhibits","Schedule document review");}
      else if(stage.includes("Review")){r.push("Complete petition review","Prepare client for filing","Order credit report");}
      else if(stage.includes("341")){r.push("Review petition with client","Prepare client for trustee questions","Confirm Zoom credentials");}
      else if(stage.includes("Filed")){r.push("Monitor case docket","Prepare for 341 hearing","Send document request to client");}
      else if(stage.includes("Discharge")){r.push("Confirm discharge entered","Send discharge letter to client","Close matter");}
      else{r.push("Review case status","Check for outstanding tasks","Follow up with client");}
    }
    return r;
  };

  // Document checklist
  const getDocChecklist=()=>{
    const docs=item.documents||[];
    const docNames=docs.map(d=>(d.name||"").toLowerCase());
    const required=[
      {name:"Pay Stubs (6 months)",key:"pay stub"},
      {name:"Bank Statements (6 months)",key:"bank statement"},
      {name:"Tax Returns (2 years)",key:"tax return"},
      {name:"Credit Report",key:"credit report"},
      {name:"Driver's License / ID",key:"license"},
      {name:"Social Security Card",key:"social security"},
      {name:"Vehicle Registration",key:"vehicle"},
      {name:"Mortgage Statement",key:"mortgage"},
      {name:"Credit Counseling Certificate",key:"credit counseling"},
    ];
    return required.map(r=>({...r,received:docNames.some(d=>d.includes(r.key))}));
  };

  // Risk flags
  const getFlags=()=>{
    const f=[];
    if(item.documents&&item.documents.length===0)f.push({text:"No documents uploaded yet",level:"warning"});
    if(!isLead&&!item.customFields?.caseNumber)f.push({text:"Case number not assigned",level:"warning"});
    if(isLead&&!item.leadNotes)f.push({text:"Lead notes not documented",level:"info"});
    if(cmi>0&&!belowMedian&&bkType==="Chapter 7")f.push({text:"Income above median — Chapter 7 eligibility at risk",level:"critical"});
    if(!isLead&&item.outstandingBalance>0)f.push({text:"Outstanding balance of "+fmtDec(item.outstandingBalance),level:"warning"});
    return f;
  };

  const recs=getRecs();
  const docChecklist=getDocChecklist();
  const flags=getFlags();
  const receivedCount=docChecklist.filter(d=>d.received).length;

  // Complexity Score Calculation
  const getComplexityScore=()=>{
    let score=0;
    let factors=[];
    // Debt level
    const debt=item.totalDebt||0;
    if(debt>100000){score+=25;factors.push({label:"High Debt (>$100k)",points:25});}
    else if(debt>50000){score+=15;factors.push({label:"Moderate Debt ($50k-$100k)",points:15});}
    else if(debt>20000){score+=8;factors.push({label:"Standard Debt ($20k-$50k)",points:8});}
    else if(debt>0){score+=3;factors.push({label:"Low Debt (<$20k)",points:3});}
    // Income above median
    if(!belowMedian&&cmi>0){score+=20;factors.push({label:"Income Above Median",points:20});}
    // Asset complexity
    const assets=item.totalAssets||0;
    if(assets>50000){score+=15;factors.push({label:"Significant Assets (>$50k)",points:15});}
    else if(assets>20000){score+=8;factors.push({label:"Moderate Assets ($20k-$50k)",points:8});}
    // Joint case
    const contacts=item.contacts||[];
    if(contacts.length>1){score+=10;factors.push({label:"Joint Filing",points:10});}
    // Missing documents
    const missingDocs=docChecklist.filter(d=>!d.received).length;
    if(missingDocs>=6){score+=15;factors.push({label:"Many Documents Missing ("+missingDocs+")",points:15});}
    else if(missingDocs>=3){score+=8;factors.push({label:"Some Documents Missing ("+missingDocs+")",points:8});}
    // Chapter 13 adds complexity
    if(bkType==="Chapter 13"){score+=15;factors.push({label:"Chapter 13 (Plan Required)",points:15});}
    // Risk flags
    if(flags.filter(f=>f.level==="critical").length>0){score+=10;factors.push({label:"Critical Risk Flags",points:10});}
    return{score:Math.min(score,100),factors};
  };
  const complexity=getComplexityScore();
  const complexityLevel=complexity.score>=70?"High":complexity.score>=40?"Medium":"Low";
  const complexityColor=complexity.score>=70?"#c0392b":complexity.score>=40?"#FF9800":"#3d5c43";

  // AI Attorney Summary
  const getAttorneySummary=()=>{
    const parts=[];
    parts.push(itemName+" — "+bkType+" "+(isLead?"lead":"matter")+", currently at \""+stage+"\" stage.");
    if(cmi>0){
      parts.push("CMI: "+fmtDec(cmi)+"/mo"+(belowMedian?" (below median, HH size "+householdSize+").":" (ABOVE median, HH size "+householdSize+" — Ch. 7 eligibility concern)."));
    }
    if(!isLead&&item.totalDebt>0){
      parts.push("Scheduled debt: "+fmtDec(item.totalDebt)+". Assets: "+fmtDec(item.totalAssets||0)+". Exemptions: "+fmtDec(item.exemptions||0)+".");
    }
    if(!belowMedian&&bkType==="Chapter 7")parts.push("ALERT: Means test may not pass — consider Chapter 13 conversion or further deduction analysis.");
    if(receivedCount<docChecklist.length){
      parts.push("Document status: "+receivedCount+"/"+docChecklist.length+" received ("+Math.round((receivedCount/docChecklist.length)*100)+"% complete). Missing items may delay filing.");
    }else{
      parts.push("All required documents received — ready for petition preparation.");
    }
    if(flags.filter(f=>f.level==="critical").length>0)parts.push("CRITICAL FLAGS present — review before proceeding.");
    parts.push("Complexity: "+complexityLevel+" ("+complexity.score+"/100).");
    if(!isLead&&item.customFields?.dateTime341)parts.push("341 Meeting: "+item.customFields.dateTime341+".");
    return parts.join(" ");
  };

  // AI Debtor Summary
  const getDebtorSummary=()=>{
    const parts=[];
    parts.push("Dear "+itemName.split(" ")[0]+", here is a summary of your "+bkType+" bankruptcy case.");
    parts.push("Your case is currently in the \""+stage+"\" phase.");
    if(cmi>0){
      if(belowMedian)parts.push("Based on your household income of "+fmtDec(cmi)+" per month, you qualify under the income limits for your household size.");
      else parts.push("Your household income of "+fmtDec(cmi)+" per month is above the threshold for your household size. Your attorney will work with you on next steps.");
    }
    if(!isLead&&item.totalDebt>0){
      parts.push("Your total reported debts are "+fmtDec(item.totalDebt)+".");
    }
    if(receivedCount<docChecklist.length){
      const missing=docChecklist.filter(d=>!d.received).map(d=>d.name);
      parts.push("We still need the following documents from you: "+missing.join(", ")+".");
    }else{
      parts.push("We have received all the documents we need from you. Thank you!");
    }
    if(!isLead&&item.customFields?.dateTime341)parts.push("Your 341 Meeting of Creditors is scheduled for "+item.customFields.dateTime341+". Your attorney will prepare you beforehand.");
    parts.push("If you have any questions, please don't hesitate to contact our office.");
    return parts.join(" ");
  };

  // PDF download handler
  const downloadSummaryPDF=(title,content)=>{
    const printWin=window.open("","_blank","width=800,height=600");
    printWin.document.write("<html><head><title>"+title+"</title><style>body{font-family:'Inter',sans-serif;padding:40px;line-height:1.8;color:#333;max-width:700px;margin:0 auto;}h1{font-size:18px;color:#3d5c43;border-bottom:2px solid #7a9c80;padding-bottom:10px;margin-bottom:20px;}.meta{font-size:12px;color:#888;margin-bottom:20px;}.content{font-size:14px;}</style></head><body>");
    printWin.document.write("<h1>"+title+"</h1>");
    printWin.document.write("<div class='meta'>Generated: "+new Date().toLocaleDateString()+" | Client: "+itemName+" | "+bkType+"</div>");
    printWin.document.write("<div class='content'>"+content+"</div>");
    printWin.document.write("<div style='margin-top:30px;padding:12px 16px;background:#f8f9fa;border-left:3px solid #d0d0d0;border-radius:4px;'><p style='font-size:11px;line-height:1.6;color:#888;margin:0;font-style:italic;'>This summary was generated by AI and is based solely on the information submitted through your intake worksheet and uploaded documents. It does not constitute legal advice. The information has not been independently verified and may contain errors or omissions. Please review all details with your attorney before relying on this summary or taking any action.</p></div>");
    printWin.document.write("</body></html>");
    printWin.document.close();
    setTimeout(()=>{printWin.print();},300);
  };

  return(
    <div>
      <div style={{fontSize:12,color:"#999",fontStyle:"italic",marginBottom:14,textAlign:"center"}}>*AI makes mistakes! A human should always confirm information</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:20}}>

        {/* AI Means Test Analysis */}
        <Widget title="AI Means Test Analysis" collapsible={false}>
          {/* Result indicator */}
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderRadius:10,background:belowMedian?"#f0f7f1":"#fef2f2",marginBottom:16}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              {belowMedian?<><path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke="#3d5c43" strokeWidth="2" strokeLinecap="round"/><path d="M22 4L12 14.01l-3-3" stroke="#3d5c43" strokeWidth="2" strokeLinecap="round"/></>:<><circle cx="12" cy="12" r="10" stroke="#c0392b" strokeWidth="2"/><path d="M15 9l-6 6M9 9l6 6" stroke="#c0392b" strokeWidth="2" strokeLinecap="round"/></>}
            </svg>
            <span style={{fontSize:14,fontWeight:600,color:belowMedian?"#3d5c43":"#c0392b"}}>{belowMedian?"Income is below the median":"Income is above the median"}</span>
          </div>

          {/* Median Family Income */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:"1px solid #f0f0f0"}}>
            <div>
              <div style={{fontSize:14,fontWeight:500,color:"#434343"}}>Median Family Income</div>
              <div style={{fontSize:11,color:"#999",marginTop:2}}>{mt.state||"California"} • Household of {householdSize} (UST)</div>
            </div>
            <div style={{fontSize:16,fontWeight:700,color:"#1a73e8"}}>{fmtDec(medianThreshold)}</div>
          </div>

          {/* Annualized CMI */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:"1px solid #f0f0f0"}}>
            <div style={{fontSize:14,fontWeight:500,color:"#434343"}}>Current Monthly Income (CMI)</div>
            <div style={{fontSize:16,fontWeight:700,color:belowMedian?"#3d5c43":"#c0392b"}}>{fmtDec(cmi)}</div>
          </div>
          {/* Confidence Score */}
          <div style={{padding:"14px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontSize:14,fontWeight:500,color:"#434343"}}>Confidence Score</div>
              <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:confidenceScore>=80?"#dce8de":confidenceScore>=50?"#FFF3E0":"#fde8e8",color:confidenceColor}}>{confidenceLevel}</span>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:28,fontWeight:700,color:confidenceColor}}>{confidenceScore}</span>
                <span style={{fontSize:12,color:"#888"}}>/100</span>
              </div>
              <div style={{width:"100%",height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden"}}>
                <div style={{width:confidenceScore+"%",height:"100%",background:confidenceColor,borderRadius:4,transition:"width 0.3s ease"}}/>
              </div>
            </div>
            <div style={{fontSize:12,color:"#777",lineHeight:"1.5"}}>{confidenceExplanation}</div>
          </div>
          <div style={{marginTop:8,padding:"10px 14px",background:"#f8f9fa",borderRadius:6,borderLeft:"3px solid #d0d0d0"}}>
            <p style={{fontSize:11,lineHeight:1.5,color:"#888",margin:0,fontStyle:"italic"}}>Confidence is based on documentation completeness: 20-point base, up to 60 points for pay stubs received (10 per month of the 6-month lookback), and 20 points if reported income is verified against tax documents within a 90% match.</p>
          </div>
        </Widget>

        {/* Complexity Score & Risk Flags */}
        <Widget title="Complexity Score" collapsible={false} actions={<span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:complexity.score>=70?"#fde8e8":complexity.score>=40?"#FFF3E0":"#dce8de",color:complexityColor}}>{complexityLevel}</span>}>
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:28,fontWeight:700,color:complexityColor}}>{complexity.score}</span>
              <span style={{fontSize:12,color:"#888"}}>/100</span>
            </div>
            <div style={{width:"100%",height:8,background:"#f0f0f0",borderRadius:4,overflow:"hidden"}}>
              <div style={{width:complexity.score+"%",height:"100%",background:complexityColor,borderRadius:4,transition:"width 0.3s ease"}}/>
            </div>
          </div>
          {complexity.factors.length>0&&(
            <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:flags.length>0?16:0}}>
              <div style={{fontSize:12,fontWeight:600,color:"#888",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:2}}>Contributing Factors</div>
              {complexity.factors.map((f,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:i<complexity.factors.length-1?"1px solid #f5f5f5":"none"}}>
                  <span style={{fontSize:13,color:"#555"}}>{f.label}</span>
                  <span style={{fontSize:12,fontWeight:600,color:complexityColor}}>+{f.points}</span>
                </div>
              ))}
            </div>
          )}
          {flags.length>0&&(
            <div>
              <div style={{fontSize:12,fontWeight:600,color:"#888",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8,paddingTop:flags.length>0&&complexity.factors.length>0?12:0,borderTop:complexity.factors.length>0?"1px solid #e0e0e0":"none"}}>Risk Flags ({flags.length})</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {flags.map((f,i)=>{
                  const colors={critical:{bg:"#fde8e8",border:"#f5c6c6",icon:"#c0392b",text:"#c0392b"},warning:{bg:"#FFF3E0",border:"#FFE0B2",icon:"#FF9800",text:"#E65100"},info:{bg:"#e8f4fd",border:"#bbdefb",icon:"#1a73e8",text:"#1565c0"}};
                  const c=colors[f.level]||colors.info;
                  return(
                    <div key={i} style={{display:"flex",gap:10,padding:8,background:c.bg,borderRadius:6,border:"1px solid "+c.border,alignItems:"center"}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{flexShrink:0}}><path d="M12 9v4M12 17h.01" stroke={c.icon} strokeWidth="2.5" strokeLinecap="round"/><circle cx="12" cy="12" r="10" stroke={c.icon} strokeWidth="1.5" fill="none"/></svg>
                      <div style={{fontSize:12,color:c.text,fontWeight:500}}>{f.text}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          <div style={{marginTop:16,padding:"10px 14px",background:"#f8f9fa",borderRadius:6,borderLeft:"3px solid #d0d0d0"}}>
            <p style={{fontSize:11,lineHeight:1.5,color:"#888",margin:0,fontStyle:"italic"}}>Score is calculated from intake data: total debt level, income relative to the state median, total assets, joint filing status, missing documents, case chapter, and critical risk flags. Each factor adds weighted points up to a maximum of 100.</p>
          </div>
        </Widget>

        {/* AI Intake Summary */}
        <Widget title="AI Intake Summary" collapsible={false} actions={<div style={{display:"flex",gap:6,alignItems:"center"}}><span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:"#e8f4fd",color:"#1a73e8",display:"flex",alignItems:"center",gap:4}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#1a73e8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>AI</span><button onClick={()=>downloadSummaryPDF("AI Intake Summary — "+itemName,getAttorneySummary())} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:"#f0f0f0",color:"#555",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:4}} title="Download as PDF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="#555" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3" stroke="#555" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>PDF</button></div>}>
          <div style={{fontSize:13,lineHeight:1.8,color:"#555"}}>{getAttorneySummary()}</div>
          <div style={{marginTop:16,padding:"12px 16px",background:"#f8f9fa",borderRadius:8,borderLeft:"3px solid #d0d0d0"}}>
            <p style={{fontSize:11,lineHeight:1.6,color:"#888",margin:0,fontStyle:"italic"}}>This summary was generated by AI and is based solely on the information submitted through your intake worksheet and uploaded documents. It does not constitute legal advice. The information has not been independently verified and may contain errors or omissions. Please review all details with your attorney before relying on this summary or taking any action.</p>
          </div>
        </Widget>

    </div>

        {/* Document Analysis + Saved Reports (matters only) */}

    </div>
  );
}

/* ─── SETTINGS PAGE ─── */
const TASK_TOGGLES_KEY="bkfl_lite_task_toggles_v1";
function getTaskToggles(){try{return JSON.parse(localStorage.getItem(TASK_TOGGLES_KEY))||{};}catch(e){return{};}}
function taskEnabled(key){return getTaskToggles()[key]!==false;}
function setTaskEnabled(key,on){const m=getTaskToggles();m[key]=on;localStorage.setItem(TASK_TOGGLES_KEY,JSON.stringify(m));}

function SettingsPage(){
  const [confirm,confirmModal]=useConfirm();
  const [settingsTab,setSettingsTab]=useState("organization");
  const [taskToggles,setTaskTogglesUi]=useState(getTaskToggles());
  const [toggleLeads,setToggleLeads]=useLocalLeads();
  const flipTask=async(key)=>{
    const en=taskToggles[key]!==false;
    if(en){
      const ok=await confirm({title:"Turn Off Task",message:"Turn this Task off? Every open copy, on every Lead, moves to the Task history as Removed, and the system stops creating new ones. Removed Tasks can be restored from the Lead\u2019s Tasks tab.",confirmLabel:"Turn Off"});
      if(!ok)return;
      const _d=new Date().toISOString().split("T")[0];
      setToggleLeads(prev=>prev.map(l=>({...l,tasks:(l.tasks||[]).map(tk=>tk.status==="Pending"&&(tk.title===key||tk.title.indexOf(key+" (")===0)?{...tk,status:"Removed",removedDate:_d}:tk)})));
    }
    setTaskEnabled(key,!en);
    setTaskTogglesUi(getTaskToggles());
  };
  const [org,setOrg]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_org_v1");return s?JSON.parse(s):{name:"McCune Legal",phone:"(303) 759-0728",website:"",street:"2101 Pearl St.",city:"Boulder",state:"CO",country:"United States",zip:"80302",logo:null};}
    catch{return{name:"McCune Legal",phone:"(303) 759-0728",website:"",street:"2101 Pearl St.",city:"Boulder",state:"CO",country:"United States",zip:"80302",logo:null};}
  });
  const [users,setUsers]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_users_v2");return s?JSON.parse(s):[
      {id:1,firstName:"Matt",lastName:"McCune",email:"matt@mccunelegal.com",role:"Attorney",createdDate:"2026-03-30",status:"Active"},
      {id:3,firstName:"Angie",lastName:"Sullivan",email:"angie@mccunelegal.com",role:"Staff",createdDate:"2026-03-30",status:"Active"},
          ];}catch{return[];}
  });
  const [showAddUser,setShowAddUser]=useState(false);
  const [editingUser,setEditingUser]=useState(null);
  const [userForm,setUserForm]=useState({firstName:"",lastName:"",email:"",role:"Staff"});
  const [orgSaved,setOrgSaved]=useState(false);

  /* Stages state */
  const [leadStages,setLeadStages]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_lead_stages");if(s)return JSON.parse(s);}catch(e){}
    return ["New Lead","Consult Scheduled","Intake Sent","Intake Submitted","Pending Engagement","Hired"];
  });
  const [matterStages,setMatterStages]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_matter_stages");if(s)return JSON.parse(s);}catch(e){}
    return {"Chapter 7":["Hired – Matter Pending Documents and Payments","All Documents In – Paid in Full","Paralegal Review","Attorney Review","Client Signing","File Case","Chapter 7 Case Filed","341 Document Request","341 Preparation","341 Hearing","341 Followup","Discharge Entered","Case Closed"],"Chapter 13":[],"Litigation":[],"Other":[]};
  });
  const [stagesBkType,setStagesBkType]=useState("Chapter 7");

  /* Document folder structure state */
  const [docFolders,setDocFolders]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_doc_folders_v2");if(s)return JSON.parse(s);}catch(e){}
    return [
      {id:1,name:"Intake Document Submissions",subfolders:["Intake Worksheet","Personal Information Documents","Income Information Documents","Assets Documents","Debts Documents","Tax Documents","Other Related Documents"]},
      {id:6,name:"Post Intake Document Followup Request",subfolders:[]},
      {id:7,name:"Other - Misc Documents",subfolders:[]},
    ];
  });
  useEffect(()=>{localStorage.setItem("bkfl_lite_doc_folders_v2",JSON.stringify(docFolders));},[docFolders]);
  const [newFolderName,setNewFolderName]=useState("");
  const [newSubfolderName,setNewSubfolderName]=useState("");
  const [addingSubTo,setAddingSubTo]=useState(null);
  const [editingFolder,setEditingFolder]=useState(null);

  const saveCF=()=>{
    if(!cfForm.label.trim())return;

      setCustomFields(prev=>[...prev,{id:"cf_"+Date.now(),key,label:cfForm.label.trim(),type:cfForm.type,scope:cfForm.scope,bkType:cfForm.bkType,dropdownOptions:opts}]);

  };

  /* AI Prompts state */
  const DEFAULT_AI_PROMPTS=[
    {id:"p1",name:"Means Test Analysis",prompt:"Analyze the uploaded documents to determine Chapter 7 eligibility. Extract monthly income from pay stubs, calculate Current Monthly Income (CMI), compare against median thresholds, and identify allowable deductions."},
    {id:"p2",name:"Preference Payment Review",prompt:"Review bank statements for potential preference payments made to creditors within 90 days before filing (1 year for insiders). Flag any payments over $600 to a single creditor."},
    {id:"p3",name:"Fraudulent Transfer Analysis",prompt:"Analyze bank statements and asset records for potential fraudulent transfers within 2 years of filing. Look for property transfers, gifts, below-market sales, and unusual withdrawals."},
    {id:"p4",name:"Income & Expense Analysis",prompt:"Extract and summarize all income sources and recurring expenses from pay stubs, bank statements, and bills. Calculate net monthly disposable income and identify any unreported income."},
    {id:"p5",name:"Asset & Exemption Review",prompt:"Review documents for all disclosed assets. Compare against applicable state exemption limits. Identify any non-exempt assets at risk of liquidation by the trustee."},
    {id:"p6",name:"Credit Report Discrepancy Check",prompt:"Cross-reference the credit report against the petition schedules. Identify any undisclosed debts, incorrect balances, or creditors not listed in the filing."},
    {id:"p7",name:"341 Meeting Preparation",prompt:"Analyze all case documents and generate likely trustee questions for the 341 Meeting of Creditors. Highlight any red flags or inconsistencies the trustee may ask about."},
    {id:"p8",name:"Ch.13 Plan Feasibility",prompt:"Evaluate whether the proposed Chapter 13 plan is feasible based on income, expenses, and debt totals. Calculate projected plan payments and determine if the debtor can maintain payments over 3-5 years."},
  ];
  const [aiPrompts,setAiPrompts]=useState(()=>{
    try{const s=localStorage.getItem("bkfl_lite_ai_prompts_v1");if(s)return JSON.parse(s);}catch(e){}
    return DEFAULT_AI_PROMPTS;

  useEffect(()=>{localStorage.setItem("bkfl_lite_ai_prompts_v1",JSON.stringify(aiPrompts));},[aiPrompts]);
  const [showPromptModal,setShowPromptModal]=useState(false);
  const [editingPrompt,setEditingPrompt]=useState(null);
  const [promptForm,setPromptForm]=useState({name:"",prompt:""});
